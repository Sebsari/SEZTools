  {(calcMethod==='beggs-brill'||calcMethod==='orkiszewski')&&<Row label="Surface tension"><NumIn value={f.liqSurfaceTension} onChange={upd('liqSurfaceTension')}/><span className="unit-tag">dyne/cm</span></Row>}
  <div style={{fontSize:11,color:'var(--text-mid)',fontWeight:600,margin:'8px 0 4px'}}>Vapor phase</div>
  <Row label={<span>Vap mass flow {db('vapMassFlow')}</span>}><NumIn value={f.vapMassFlow} onChange={upd('vapMassFlow')} disabled={isD('vapMassFlow')}/><select className="unit-sel" value={fU.vapMassFlow} disabled={isD('vapMassFlow')} onChange={function(e){changeFU('vapMassFlow',e.target.value);}}><option value="SI">kg/h</option><option value="US">lb/h</option></select></Row>
  <Row label={<span>Vap vol flow {db('vapVolFlow')}</span>}><NumIn value={f.vapVolFlow} onChange={upd('vapVolFlow')} disabled={isD('vapVolFlow')}/><select className="unit-sel" value={fU.vapVolFlow} disabled={isD('vapVolFlow')} onChange={function(e){changeFU('vapVolFlow',e.target.value);}}><option value="SI">m3/h</option><option value="US">gal/min</option></select></Row>
  <Row label={<span>Vap density {db('vapDensity')}</span>}><NumIn value={f.vapDensity} onChange={upd('vapDensity')} disabled={isD('vapDensity')}/><select className="unit-sel" value={fU.vapDensity} disabled={isD('vapDensity')} onChange={function(e){changeFU('vapDensity',e.target.value);}}><option value="SI">kg/m3</option><option value="US">lb/ft3</option></select></Row>
  <Row label="Vap viscosity"><NumIn value={f.vapViscosity} onChange={upd('vapViscosity')}/><span className="unit-tag">cP</span></Row>
  <Row label="Operating pressure"><NumIn value={f.operatingPressure} onChange={upd('operatingPressure')}/><span className="unit-tag">barg</span></Row></div>}

  <div className="card-title" style={{marginTop:8}}>Pipe Information</div>
  <Row label="Pipe schedule"><select style={Object.assign({},iS,{width:'auto',minWidth:130,textAlign:'left'})} value={schedule} onChange={function(e){changeSch(e.target.value);}}>{SCHEDULE_OPTIONS.map(function(o){return <option key={o.key} value={o.key}>{o.label}</option>;})}</select></Row>
  <Row label="Line length"><NumIn value={f.length} onChange={upd('length')}/><select className="unit-sel" value={fU.length} onChange={function(e){changeFU('length',e.target.value);}}><option value="SI">m</option><option value="US">ft</option></select></Row>
  <Row label="Pipe roughness"><select style={Object.assign({},iS,{width:'auto',minWidth:200,textAlign:'left'})} value={f.roughness} onChange={function(e){var nf=Object.assign({},f);nf.roughness=parseFloat(e.target.value);setF(nf);rc(nf,flowType,calcMethod,schedule,fU,fits);}}>{ROUGH_OPTS.map(function(o){return <option key={o.value} value={o.value}>{o.label}</option>;})}</select></Row>
  {flowType==='twophase'&&(calcMethod==='beggs-brill'||calcMethod==='dukler')&&<Row label="Inclination"><NumIn value={f.inclination} onChange={upd('inclination')} style={{width:80}}/><span className="unit-tag">deg (0=horiz, 90=vert)</span></Row>}

  <div className="card-title" style={{marginTop:8}}>Fittings &amp; Losses</div>
  <div style={{marginTop:8}}>{fits.length===0&&<div style={{fontSize:12,color:'var(--text-muted)',marginBottom:10}}>No fittings added.</div>}
  {fits.map(function(fi,i){var isUD=FITTINGS_DB[fi.idx].desc==='User Defined',fit=FITTINGS_DB[fi.idx];return <div key={i} className="fitting-row">
  <select style={Object.assign({},iS,{width:'auto',minWidth:160,textAlign:'left',flex:'1 1 180px'})} value={fi.idx} onChange={function(e){upFit(i,'idx',e.target.value);}}>{FITTINGS_DB.map(function(f2,j){return <option key={j} value={j}>{f2.desc}</option>;})}</select>
  <span style={{fontSize:11,color:'var(--text-muted)'}}>&times;</span>
  <NumIn value={fi.qty} onChange={function(e){upFit(i,'qty',e.target.value===''?1:Math.max(1,parseInt(e.target.value)||1));}} style={{width:60}}/>
  {isUD&&<span><span className="unit-tag">K=</span><NumIn value={fi.customK} onChange={function(e){upFit(i,'customK',e.target.value===''?0:parseFloat(e.target.value)||0);}} style={{width:80}}/></span>}
  {!isUD&&fit.vh>0&&<span className="unit-tag">K={fit.vh}</span>}
  {!isUD&&fit.ft>0&&<span className="unit-tag">L/D={fit.ft}</span>}
  <button style={{background:'#FBEDEB',color:'var(--err)',border:'1px solid #FECACA',borderRadius:'var(--r-sm)',padding:'4px 10px',fontSize:14,fontWeight:700,lineHeight:1,cursor:'pointer'}} onClick={function(){rmFit(i);}}>&times;</button>
  </div>;})}<div style={{marginTop:10}}><button className="btn-sm btn-outline" onClick={addFit}>+ Add Fitting</button></div></div>

  <div className="card-title" style={{marginTop:8}}>Criteria &amp; Overdesign</div>
  <Row label="Min velocity"><NumIn value={f.minV} onChange={upd('minV')}/><select className="unit-sel" value={fU.minV} onChange={function(e){changeFU('minV',e.target.value);}}><option value="SI">m/s</option><option value="US">ft/s</option></select></Row>
  <Row label="Max velocity"><NumIn value={f.maxV} onChange={upd('maxV')}/><select className="unit-sel" value={fU.maxV} onChange={function(e){changeFU('maxV',e.target.value);}}><option value="SI">m/s</option><option value="US">ft/s</option></select></Row>
  {f.minV!==''&&f.maxV!==''&&!Number.isNaN(parseFloat(f.minV))&&!Number.isNaN(parseFloat(f.maxV))&&parseFloat(f.minV)>=parseFloat(f.maxV)&&<div className="warn-box">Min velocity should be less than max.</div>}
  <Row label={<span>Erosional C <span style={{fontSize:10,color:'var(--text-muted)'}}>(API 14E)</span></span>}><NumIn value={f.erosionalC} onChange={upd('erosionalC')}/></Row>
  <Row label="Overdesign"><NumIn value={f.overdesign} onChange={upd('overdesign')}/><span className="unit-tag">%</span></Row>
  {flowType==='liquid'&&calcMethod==='hazen-williams'&&<Row label={<span>C_HW <span style={{fontSize:10,color:'var(--text-muted)'}}>(roughness)</span></span>}><NumIn value={f.C_HW} onChange={function(e){var nf=Object.assign({},f);nf.C_HW=e.target.value===''?130:Math.max(1,parseFloat(e.target.value)||130);setF(nf);rc(nf,flowType,calcMethod,schedule,fU,fits);}}/><span className="unit-tag">130=new steel</span></Row>}
  {flowType==='gas'&&calcMethod==='panhandle-b'&&<Row label={<span>Efficiency E <span style={{fontSize:10,color:'var(--text-muted)'}}>(Panhandle)</span></span>}><NumIn value={f.efficiencyE} onChange={function(e){var nf=Object.assign({},f);nf.efficiencyE=e.target.value===''?0.92:Math.max(0.5,Math.min(1,parseFloat(e.target.value)||0.92));setF(nf);rc(nf,flowType,calcMethod,schedule,fU,fits);}}/><span className="unit-tag">0.88-0.95</span></Row>}
  </div>

  {!result&&<div className="card fade-in" style={{textAlign:'center',color:'var(--text-muted)',fontSize:13,border:'1px dashed var(--border)'}}>Enter values to see results.</div>}
  {result&&rec&&<div className="card fade-in">
  <div className="result-header"><div><span style={{fontSize:12,color:'var(--text-mid)',fontWeight:600}}>Recommended</span>
  <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}><div className="result-size">{rec.nps}</div>
  <div className="result-meta">ID ({schL}): {rId.toFixed(unitSys==='SI'?1:3)} {dL}</div>
  {rec.pattern&&<div className="result-meta">Pattern: <b>{rec.pattern}</b></div>}
  {f.overdesign>0&&<div className="result-meta">OD: {f.overdesign}%</div>}</div></div>
  <div style={{display:'flex',gap:8,alignItems:'center'}}><Badge s={rec.status}/><button className="btn-sm btn-outline no-print" onClick={genReport}>PDF</button></div></div>
  <Gauge V={rV} minV={UNIT_CONV.velocity[unitSys].fromSI(UNIT_CONV.velocity[fU.minV].toSI(f.minV))} maxV={UNIT_CONV.velocity[unitSys].fromSI(UNIT_CONV.velocity[fU.maxV].toSI(f.maxV))} Ve={rVe}/>
  <div className="stats-grid"><Stat label="Velocity" value={rV.toFixed(2)+' '+vL}/>
  {rDR!=null&&<Stat label={'dP/'+(unitSys==='SI'?'km':'1000ft')} value={rDR.toFixed(4)+' '+pL}/>}
  {rDT!=null&&<Stat label="Pipe dP" value={(rDT||0).toFixed(3)+' '+tpL}/>}
  {hF&&<Stat label="FitK" value={rFK.toFixed(2)}/>}
  {hF&&<Stat label="FitDp" value={rFD.toFixed(3)+' '+tpL}/>}
  <Stat label={hF?"Combined dP":"Total dP"} value={totDp.toFixed(3)+' '+tpL}/>
  {rVe!=null&&<Stat label="Ve" value={rVe.toFixed(2)+' '+vL}/>}
  {rVe!=null&&<Stat label="%Ve" value={((rec.V/rec.Ve)*100).toFixed(0)+'%'}/>}</div>
  {result.note&&<div className="warn-box" style={{marginTop:12}}>{result.note}</div>}
  <details open style={{marginTop:14}}><summary>All sizes checked</summary>
  <div className="table-scroll" style={{marginTop:8}}><table className="results-table"><thead><tr><th>NPS</th><th>ID</th><th>V</th>{flowType==='twophase'&&<th>Pattern</th>}<th>dP</th>{hF&&<th>FitK</th>}{hF&&<th>FitDp</th>}<th>Ve</th><th>Status</th></tr></thead>
  <tbody>{result.rows.map(function(r){var rfd=UNIT_CONV.pressureTotal[unitSys].fromSI(r.fitDp);return <tr key={r.nps} className={r.nps===rec.nps?'hl':''}><td>{r.nps}</td><td>{UNIT_CONV.diameter[unitSys].fromSI(r.id).toFixed(1)}</td><td>{UNIT_CONV.velocity[unitSys].fromSI(r.V).toFixed(2)}</td>{flowType==='twophase'&&<td>{r.pattern}</td>}<td>{r.dP!=null?UNIT_CONV.dpRate[unitSys].fromSI(r.dP).toFixed(3):'\u2014'}</td>{hF&&<td>{r.fitK>0?r.fitK.toFixed(2):'\u2014'}</td>}{hF&&<td>{r.fitDp>0?rfd.toFixed(4):'\u2014'}</td>}<td>{r.Ve!=null?UNIT_CONV.velocity[unitSys].fromSI(r.Ve).toFixed(2):'\u2014'}</td><td><Badge s={r.status}/></td></tr>;})}</tbody></table></div></details></div>}</div>}

  {tab==='excel'&&<div><div className="card fade-in"><div className="card-title">Step 1 - Template</div>
  <p style={{fontSize:12,color:'var(--text-mid)',lineHeight:1.9,marginBottom:12}}>Variables-as-rows. Fittings not in batch. Flow type (Liquid/Gas/Two-Phase) is auto-detected per column from which mass-flow row has a value \u2014 fill Liq fields for a liquid line, Vap fields for a gas line, or both for two-phase. Pick the calc method for each flow type below; it applies to every row of that type.</p>
  <div style={{display:'flex',flexWrap:'wrap',gap:14,marginBottom:12}}>
  <div><label style={{fontSize:11,color:'var(--text-muted)',display:'block',marginBottom:3}}>Liquid method</label><select value={mLiq} onChange={function(e){setMLiq(e.target.value);}} style={{fontSize:12,padding:'5px 8px'}}>{CALC_METHODS.liquid.map(function(m){return <option key={m.key} value={m.key}>{m.label}</option>;})}</select></div>
  <div><label style={{fontSize:11,color:'var(--text-muted)',display:'block',marginBottom:3}}>Gas method</label><select value={mGas} onChange={function(e){setMGas(e.target.value);}} style={{fontSize:12,padding:'5px 8px'}}>{CALC_METHODS.gas.map(function(m){return <option key={m.key} value={m.key}>{m.label}</option>;})}</select></div>
  <div><label style={{fontSize:11,color:'var(--text-muted)',display:'block',marginBottom:3}}>Two-Phase method</label><select value={mTwo} onChange={function(e){setMTwo(e.target.value);}} style={{fontSize:12,padding:'5px 8px'}}>{CALC_METHODS.twophase.map(function(m){return <option key={m.key} value={m.key}>{m.label}</option>;})}</select></div>
  </div>
  <button className="btn-sm btn-outline" onClick={dlTpl}>Download template</button></div>
  <div className="card fade-in"><div className="card-title">Step 2 - Upload</div>
  <input ref={fRef} type="file" accept=".xlsx,.xls" onChange={handleFile} style={{fontSize:13}}/>
  {eF&&<div style={{fontSize:12,color:'var(--text-mid)',marginTop:8}}>File: {eF}</div>}
  {lC>0&&!eE&&<div style={{fontSize:12,color:'var(--ok)',marginTop:4}}>{lC} line{lC===1?'':'s'}</div>}
  {eE&&<div className="err-box" style={{marginTop:12}}>{eE}</div>}
  {pR&&!pW&&<div style={{marginTop:16}}><div className="card-title" style={{marginBottom:8}}>Step 3</div>
  {iP?<span style={{fontSize:13,color:'var(--text-mid)'}}>Processing...</span>:<span><button className="btn-sm btn-accent" onClick={startProc}>Process</button><span style={{fontSize:12,color:'var(--text-muted)',marginLeft:12}}>Double-check first</span></span>}</div>}
  {rowWarnings&&<div className="err-box" style={{marginTop:12}}><b>{rowWarnings.length} row{rowWarnings.length===1?'':'s'} with missing/invalid data:</b><ul style={{margin:'6px 0 0',paddingLeft:18}}>{rowWarnings.map(function(w,i){return <li key={i} style={{fontSize:12}}>{w}</li>;})}</ul></div>}
  {pW&&<div style={{marginTop:16}}><div className="card-title" style={{marginBottom:8}}>Step 4</div>
  <button className="btn-sm btn-accent" onClick={function(){dlBlob(XLSX.write(pW,{bookType:'xlsx',type:'array'}),'line-sizing-results.xlsx');}}>Download</button></div>}</div></div>}

  <div className="footer">Engineering prototype. ASME B36.10/B36.19. Darcy-SJ, Hazen-Williams, Weymouth, Panhandle B, Compressible Isothermal, Beggs &amp; Brill, Baker-Ludwig, Orkiszewski, Dukler-Flanigan, Lockhart-Martinelli.</div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
