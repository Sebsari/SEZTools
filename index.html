<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SEZTools</title>
<meta name="theme-color" content="#0B5FA5"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: local('JetBrains Mono');
    font-weight: 400 700;
  }
  :root{
    --bg:#E7EBEF; --surface:#FFFFFF; --surface2:#F3F5F7;
    --accent:#0B5FA5; --accent-dark:#084578;
    --ok:#256339; --warn:#A67A1E; --err:#9C3A32;
    --text:#1E2A33; --text-mid:#4A5A63; --text-muted:#8A9AA3;
    --border:#C7CDD3; --r-sm:6px; --r-md:10px; --r-lg:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    overflow:hidden;
  }
  #app{position:fixed; inset:0; overflow:hidden}

  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transform:translateY(8px);
    transition:opacity .32s ease, transform .32s ease;
  }
  .screen.active{opacity:1; pointer-events:auto; transform:translateY(0)}

  /* ---------- background grid, shared blueprint texture ---------- */
  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:28px 28px;
    opacity:.35;
    pointer-events:none;
  }

  /* ---------- SPLASH ---------- */
  #splash{align-items:center; justify-content:center}
  .splash-inner{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; gap:34px;
    padding:24px; text-align:center;
  }
  .brand-mark{
    font-size:13px; font-weight:700; letter-spacing:4px;
    color:var(--accent); background:rgba(11,95,165,.08);
    padding:6px 14px; border-radius:var(--r-sm);
  }
  .brand-name{
    font-size:44px; font-weight:700; letter-spacing:1px; color:var(--text);
  }
  .brand-tag{
    font-size:12px; color:var(--text-muted); letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .enter-btn{
    width:132px; height:132px; border-radius:50%;
    background:var(--accent); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 30px rgba(11,95,165,.35);
    transition:transform .18s ease, box-shadow .18s ease;
    position:relative;
  }
  .enter-btn::before{
    content:''; position:absolute; inset:-10px; border-radius:50%;
    border:1px solid var(--border);
  }
  .enter-btn:hover{transform:scale(1.04); box-shadow:0 14px 36px rgba(11,95,165,.45)}
  .enter-btn:active{transform:scale(.97)}
  .enter-btn svg{width:38px; height:38px}
  .enter-label{font-size:11px; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase}
  .splash-version{
    position:absolute; bottom:20px; left:0; right:0;
    text-align:center; font-size:10px; color:var(--text-muted); letter-spacing:1px;
  }

  /* ---------- MENU ---------- */
  #menu{padding:0}
  .menu-header{
    display:flex; align-items:baseline; gap:14px;
    padding:18px 20px 14px; border-bottom:1px solid var(--border);
    position:relative; z-index:1; background:var(--bg);
  }
  .menu-header .brand-mark{font-size:11px; padding:3px 9px}
  .menu-header .h-title{font-size:14px; font-weight:600}
  .menu-list{
    position:relative; z-index:1;
    flex:1; overflow-y:auto;
    padding:20px; display:flex; flex-direction:column; gap:14px;
    max-width:520px; width:100%; margin:0 auto;
  }
  .mod-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-md); padding:20px;
    display:flex; align-items:center; gap:16px; cursor:pointer;
    transition:border-color .15s, transform .12s;
    text-align:left;
  }
  .mod-card:hover{border-color:var(--accent); transform:translateY(-1px)}
  .mod-card:active{transform:translateY(0)}
  .mod-icon{
    width:52px; height:52px; border-radius:var(--r-sm);
    background:rgba(11,95,165,.08); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .mod-icon svg{width:26px; height:26px}
  .mod-body{flex:1; min-width:0}
  .mod-name{font-size:14px; font-weight:700; color:var(--text)}
  .mod-desc{font-size:11px; color:var(--text-muted); margin-top:4px; line-height:1.6}
  .mod-arrow{color:var(--text-muted); flex-shrink:0}
  .menu-footer{
    position:relative; z-index:1;
    text-align:center; font-size:10px; color:var(--text-muted);
    padding:14px; letter-spacing:.5px;
  }

  /* ---------- MODULE VIEW ---------- */
  #moduleView{background:var(--surface)}
  .module-bar{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; background:var(--bg); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .back-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:7px 12px; cursor:pointer;
    font-family:inherit; font-size:11px; font-weight:600; color:var(--text-mid);
  }
  .back-btn:hover{border-color:var(--accent); color:var(--accent)}
  .back-btn svg{width:14px; height:14px}
  .module-bar .m-title{font-size:12px; font-weight:600; color:var(--text)}
  .module-frame-wrap{flex:1; position:relative}
  #moduleFrame{position:absolute; inset:0; width:100%; height:100%; border:none; background:var(--surface)}
  .frame-loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--surface); font-size:11px; color:var(--text-muted); letter-spacing:1px;
    transition:opacity .2s ease;
  }

  @media (min-width:700px){
    .brand-name{font-size:56px}
    .enter-btn{width:150px; height:150px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- SPLASH -->
  <section id="splash" class="screen active">
    <div class="grid-bg"></div>
    <div class="splash-inner">
      <div class="brand-mark">SEZTOOLS</div>
      <div>
        <div class="brand-name">SEZTools</div>
        <div class="brand-tag" style="margin-top:8px">Sizing Tools for Process Engineers</div>
      </div>
      <button class="enter-btn" id="enterBtn" aria-label="Enter">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <div class="enter-label">Tap to enter</div>
    </div>
    <div class="splash-version">v1.0</div>
  </section>

  <!-- MENU -->
  <section id="menu" class="screen">
    <div class="grid-bg"></div>
    <div class="menu-header">
      <span class="brand-mark">SEZTOOLS</span>
      <span class="h-title">Modules</span>
    </div>
    <div class="menu-list">
      <button class="mod-card" data-module="pump-module.html" data-title="Pump Hydraulic Calc.">
        <div class="mod-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="7"/><path d="M12 8v4l3 2"/>
          </svg>
        </div>
        <div class="mod-body">
          <div class="mod-name">Pump Hydraulic Calc.</div>
          <div class="mod-desc">Equipment sequence builder, line &amp; fitting losses, NPSH, TDH and datasheet export</div>
        </div>
        <div class="mod-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </button>

      <button class="mod-card" data-module="linesizing-module.html" data-title="Line Sizing">
        <div class="mod-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h6M15 12h6M9 12a3 3 0 1 0 6 0 3 3 0 1 0-6 0"/>
          </svg>
        </div>
        <div class="mod-body">
          <div class="mod-name">Line Sizing</div>
          <div class="mod-desc">Single &amp; multi-line sizing for liquid, gas, vapor and two-phase flow</div>
        </div>
        <div class="mod-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </button>
    </div>
    <div class="menu-footer">SEZTools &middot; works offline once installed</div>
  </section>

  <!-- MODULE VIEW -->
  <section id="moduleView" class="screen">
    <div class="module-bar">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        Modules
      </button>
      <span class="m-title" id="moduleTitle"></span>
    </div>
    <div class="module-frame-wrap">
      <div class="frame-loading" id="frameLoading">LOADING…</div>
      <iframe id="moduleFrame" title="module"></iframe>
    </div>
  </section>

</div>

<script>
(function(){
  var screens = { splash: document.getElementById('splash'), menu: document.getElementById('menu'), module: document.getElementById('moduleView') };
  function show(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle('active', k===name); });
  }

  document.getElementById('enterBtn').addEventListener('click', function(){ show('menu'); });

  var frame = document.getElementById('moduleFrame');
  var frameLoading = document.getElementById('frameLoading');
  var moduleTitle = document.getElementById('moduleTitle');
  var loadedSrc = null;

  document.querySelectorAll('.mod-card').forEach(function(card){
    card.addEventListener('click', function(){
      var src = card.getAttribute('data-module');
      var title = card.getAttribute('data-title');
      moduleTitle.textContent = title;
      show('module');
      if (loadedSrc !== src){
        frameLoading.style.opacity = '1';
        frame.src = src;
        loadedSrc = src;
      }
    });
  });

  frame.addEventListener('load', function(){ frameLoading.style.opacity = '0'; });

  document.getElementById('backBtn').addEventListener('click', function(){ show('menu'); });

  // basic offline install
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
