<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SEZTools - Pump Hydraulic Calc.</title>
<link rel="icon" href="icon-192.png"/>
<style>
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('vendor/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2');}

    --surface-2: #FFFFFF;

    --border-strong: #9AA3AA;

<body>
<div class="app-shell">
  <h1>Pump Hydraulic Calc.</h1>
  <p class="subtitle">Crane TP-410 based K-factor / Darcy-Weisbach line loss calc, per-zone fluid properties, and a final suction/discharge/NPSH/power summary.</p>

<div id="palette" style="display:flex; flex-direction:column; gap:10px; margin-bottom:1.5rem;"></div>

<div id="fluid-zones-panel" style="display:flex; flex-wrap:wrap; gap:12px; margin-bottom:1.25rem;"></div>

<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
  <span style="font-size:13px; color:var(--text-secondary);">Equipment sequence (click an item or line)</span>
  <button id="reset-btn" style="font-size:13px; padding:6px 12px;">&#8635; Clear</button>
</div>

<div id="chain-wrap" style="overflow-x:auto; overflow-y:hidden; background:var(--surface-1); border-radius:8px;"></div>

<div id="form-panel" style="display:none; margin-top:1rem; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:1rem 1.25rem;"></div>

<div style="margin-top:1.5rem; background:var(--surface-1); border-radius:8px; padding:0.9rem 1rem;">

  <div id="report-info-fields" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px;"></div>
</div>

<div id="calc-status" style="margin-top:1.5rem; font-size:13px; padding:10px 14px; border-radius:8px;"></div>

<div style="margin-top:0.75rem; display:flex; justify-content:flex-end; gap:8px;">
  <button id="pdf-btn" style="font-size:13px; padding:8px 16px; border:1px solid var(--border-strong);">Export PDF</button>

</div>
<div id="summary-panel" style="display:none; margin-top:1rem; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:1.25rem;"></div>
<div id="print-report"></div>
</div>

<script>
const RED = '#9C3A32', BLUE = '#0B5FA5', AMBER = '#A67A1E';

// ---- Shared pipe library (kept consistent with the Line Sizing module) ----

const PIPE_SIZES = {
  40:[{nps:'1/8"',d:6.35},{nps:'1/4"',d:9.25},{nps:'3/8"',d:12.52},{nps:'1/2"',d:15.8},{nps:'3/4"',d:20.93},{nps:'1"',d:26.64},{nps:'1-1/4"',d:35.05},{nps:'1-1/2"',d:40.89},{nps:'2"',d:52.5},{nps:'2-1/2"',d:62.71},{nps:'3"',d:77.93},{nps:'3-1/2"',d:90.12},{nps:'4"',d:102.26},{nps:'5"',d:128.2},{nps:'6"',d:154.08},{nps:'8"',d:203.2},{nps:'10"',d:254.51},{nps:'12"',d:304.8},{nps:'14"',d:336.55},{nps:'16"',d:387.35},{nps:'18"',d:438.15},{nps:'20"',d:488.95},{nps:'22"',d:539.75},{nps:'24"',d:590.55},{nps:'26"',d:641.34},{nps:'28"',d:692.14},{nps:'30"',d:742.94},{nps:'32"',d:793.74},{nps:'34"',d:844.54},{nps:'36"',d:895.34},{nps:'42"',d:1047.74},{nps:'48"',d:1200.14}],
  80:[{nps:'1/8"',d:5.26},{nps:'1/4"',d:7.75},{nps:'3/8"',d:10.72},{nps:'1/2"',d:13.87},{nps:'3/4"',d:18.85},{nps:'1"',d:24.31},{nps:'1-1/4"',d:32.46},{nps:'1-1/2"',d:38.1},{nps:'2"',d:49.25},{nps:'2-1/2"',d:58.88},{nps:'3"',d:73.66},{nps:'3-1/2"',d:85.45},{nps:'4"',d:97.18},{nps:'5"',d:122.25},{nps:'6"',d:146.33},{nps:'8"',d:193.68},{nps:'10"',d:242.82},{nps:'12"',d:288.93},{nps:'14"',d:317.5},{nps:'16"',d:363.53},{nps:'18"',d:409.58},{nps:'20"',d:455.63},{nps:'22"',d:501.68},{nps:'24"',d:546.1},{nps:'26"',d:635.0},{nps:'28"',d:685.8},{nps:'30"',d:736.6},{nps:'32"',d:787.4},{nps:'34"',d:838.2},{nps:'36"',d:889.0},{nps:'42"',d:1041.4},{nps:'48"',d:1193.8}]
};
[5,10,20,30,60,100,120,140,160,'STD','XS','XXS'].forEach(s => { PIPE_SIZES[s] = PIPE_SIZES[s] || PIPE_SIZES[40].map(p => ({d:p.d, nps:p.nps})); });
const SCHEDULE_OPTIONS = [40,80,5,10,20,30,60,100,120,140,160,'STD','XS','XXS'].map(s => ({value:String(s), label:'Sch '+s}));
// Nominal size in inches per NPS label — used for fitting K-tables (Crane
// method factors are based on nominal size, not the exact internal diameter).
const NPS_NOMINAL_IN = {'1/8"':0.125,'1/4"':0.25,'3/8"':0.375,'1/2"':0.5,'3/4"':0.75,'1"':1,'1-1/4"':1.25,'1-1/2"':1.5,'2"':2,'2-1/2"':2.5,'3"':3,'3-1/2"':3.5,'4"':4,'5"':5,'6"':6,'8"':8,'10"':10,'12"':12,'14"':14,'16"':16,'18"':18,'20"':20,'22"':22,'24"':24,'26"':26,'28"':28,'30"':30,'32"':32,'34"':34,'36"':36,'42"':42,'48"':48};
const PIPE_NPS_OPTIONS = PIPE_SIZES[40].map(p => p.nps);
const PIPE_MATERIAL_OPTIONS = [
  {value:0.0015, label:'Drawn tubing (0.0015 mm)'}, {value:0.045, label:'Commercial steel (0.045 mm)'},
  {value:0.26, label:'Cast iron (0.26 mm)'}, {value:0.15, label:'Galvanized iron (0.15 mm)'},
  {value:0.0015, label:'PVC / HDPE (0.0015 mm)'}
];
function pipeIdMm(schedule, nps) {
  const table = PIPE_SIZES[schedule] || PIPE_SIZES[40];
  const row = table.find(p => p.nps === nps);
  return row ? row.d : null;
}
const commonField = {k:'elevation', l:'Installation elevation above grade (m)', num:true};
const FLUID_FIELDS = [
  {k:'density', l:'Density (kg/m3)', num:true}, {k:'viscosity', l:'Viscosity (cP)', num:true},
  {k:'vapor', l:'Vapor pressure (bara)', num:true}
];
// Generic role-based field sets, applied to "vessel-type" equipment
// (Tank / Tower / Misc) depending on where it sits in the sequence: source
// (suction boundary), destination (discharge boundary), or intermediate
// (mid-path). Exchanger always uses the intermediate set since it can never
// be a boundary node.
const sourceRoleFields = [commonField,
  {k:'nozzle_elev_out', l:'Outlet nozzle elevation above equipment base (m)'},
  {k:'hhll', l:'HHLL (m)'}, {k:'llll', l:'LLLL (m)'},
  {k:'opress', l:'Operating pressure (bar)'}, {k:'despress', l:'Design pressure (bar)'}
];
const destRoleFields = [commonField,
  {k:'nozzle_elev_in', l:'Inlet nozzle elevation above equipment base (m)'},
  {k:'opress', l:'Operating pressure (bar)'}
];
const midRoleFields = [commonField,
  {k:'nozzle_elev_in', l:'Inlet nozzle elevation above equipment base (m)'},
  {k:'nozzle_elev_out', l:'Outlet nozzle elevation above equipment base (m)'},
  {k:'dp', l:'Pressure Drop (bar)'}
];
const equipDefs = {
  tank: {label:'Tank', roleFields:true},
  pump: {label:'Pump', fields:[commonField,
    {k:'flow', l:'Flow (m3/h)'},
    {k:'suction_nozzle_elev', l:'Suction nozzle center elevation above pump base (m)'},
    {k:'npshr', l:'NPSH required (m)'}, {k:'effp', l:'Pump efficiency (%)'}, {k:'effm', l:'Motor efficiency (%)'}

    {k:'dp', l:'Pressure drop (bar)'}
  ]},

  point: {label:'High point', fields:[commonField,

  ]},
  tower: {label:'Tower', roleFields:true},
  filter: {label:'Filter', fields:[commonField,
    {k:'dp', l:'Pressure drop (bar)'}
  ]},
  misc: {label:'Miscellaneous', roleFields:true, extraFields:[{k:'desc', l:'Description'}]},
  orifice: {label:'Orifice', fields:[
    {k:'dp', l:'Pressure drop (bar)'}
  ]},
  flowtx: {label:'Flow Transmitter', fields:[

  ]},
  reducer: {label:'Reducer (large\u2192small)', fields:[

  enlarger: {label:'Enlarger (small\u2192large)', fields:[

  ], isTransition:true, noTag:true},
  branch: {label:'Tee', fields:[
    {k:'to', l:'To equipment tag'}
  ], isBranch:true}
};
const EQUIP_DP_TYPES = ['valve','orifice','filter','misc','exchanger'];
const STARTER_IDS = ['tank','tower','misc'];
const PALETTE_GROUPS = [
  {label:'Equipment', ids:['tank','exchanger','tower','pump','filter','misc']},
  {label:'Instrumentation', ids:['valve','orifice','flowtx']},
  {label:'Piping', ids:['reducer','enlarger','branch','point']}
];
const lineFieldsPre = [
  {k:'schedule', l:'Pipe schedule', select: SCHEDULE_OPTIONS}
];
const lineFieldsPost = [
  {k:'roughness', l:'Pipe material / roughness', select: PIPE_MATERIAL_OPTIONS},
  {k:'length', l:'Length (m)', num:true}
];
const lineFields = lineFieldsPre.concat([{k:'nps', l:'Pipe size (NPS)', select: PIPE_NPS_OPTIONS}], lineFieldsPost);
const lineFlowField = {k:'flow', l:'Flow (m3/h)', num:true};
const LINE_COMPLETE_FIELDS = lineFields.concat([lineFlowField]);

// Picks the smallest NPS (in the given schedule) whose actual internal
// diameter keeps velocity at or below the target — used by the "size by
// velocity" mode as an alternative to manually choosing a pipe size.
function pickNpsByVelocity(schedule, flowM3h, maxVelocity) {
  const table = PIPE_SIZES[schedule] || PIPE_SIZES[40];
  const Qm3s = flowM3h / 3600;
  for (let i = 0; i < table.length; i++) {
    const idM = table[i].d / 1000;
    const area = Math.PI * idM * idM / 4;
    const v = Qm3s / area;
    if (v <= maxVelocity) return {nps: table[i].nps, velocity: v};
  }
  const last = table[table.length - 1];
  const idM = last.d / 1000;
  const v = Qm3s / (Math.PI * idM * idM / 4);
  return {nps: last.nps, velocity: v, oversized: true};
}

function sizeModeBlockHtml(line) {
  const mode = line.data.sizeMode || 'manual';
  let html = '<div style="margin:10px 0; padding:10px; border:1px solid var(--border); border-radius:var(--r-sm);">';
  html += '<label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px;">Pipe size</label>';
  html += '<select class="size-mode-select" style="width:100%; margin-bottom:8px;">' +
    '<option value="manual"' + (mode==='manual'?' selected':'') + '>Choose NPS manually</option>' +
    '<option value="byVelocity"' + (mode==='byVelocity'?' selected':'') + '>Size by max velocity</option>' +
    '</select>';
  if (mode === 'manual') {
    html += buildFieldsHtml([{k:'nps', l:'Pipe size (NPS)', select: PIPE_NPS_OPTIONS}], line.data, 'spec-field');
  } else {
    html += buildFieldsHtml([{k:'maxVelocity', l:'Max allowable velocity (m/s)', num:true}], line.data, 'spec-field');
    const flowVal = parseFloat(line.data.flow);
    const maxV = parseFloat(line.data.maxVelocity);
    if (flowVal && maxV) {
      const picked = pickNpsByVelocity(line.data.schedule || '40', flowVal, maxV);
      line.data.nps = picked.nps;
      html += '<p style="font-size:11px; color:var(--text-muted); margin:6px 0 0;">Picked size: <b style="color:var(--text-accent);">' + picked.nps + '</b> \u2014 actual velocity ' + picked.velocity.toFixed(2) + ' m/s' + (picked.oversized ? ' (largest available size still exceeds target)' : '') + '</p>';
    } else {
      html += '<p style="font-size:11px; color:var(--text-muted); margin:6px 0 0;">Enter flow and a target velocity to auto-pick a size.</p>';
    }
  }
  html += '</div>';
  return html;
}

const FT_TABLE = [
  {size:0.5, ft:.027},{size:0.75, ft:.025},{size:1, ft:.023},{size:1.25, ft:.022},{size:1.5, ft:.021},
  {size:2, ft:.019},{size:2.5, ft:.018},{size:3, ft:.018},{size:4, ft:.017},{size:5, ft:.016},
  {size:6, ft:.015},{size:8, ft:.014},{size:10, ft:.014},{size:12, ft:.013},{size:14, ft:.013},
  {size:16, ft:.013},{size:18, ft:.012},{size:20, ft:.012},{size:24, ft:.012}
];
function getFt(sizeIn) {
  if (!sizeIn || sizeIn <= 0) return null;
  let best = FT_TABLE[0], bestDiff = Infinity;
  FT_TABLE.forEach(r => { const d = Math.abs(r.size - sizeIn); if (d < bestDiff) { bestDiff = d; best = r; } });
  return best.ft;
}

const FITTING_TYPES = [
  'Gate Valve', 'Globe Valve', 'Angle Valve (K=55fT)', 'Angle Valve (K=150fT)', 'Ball Valve', 'Plug Valve / Cock', 'Butterfly Valve',
  'Swing Check Valve (K=50fT)', 'Swing Check Valve (K=100fT)', 'Lift Check Valve (Globe)', 'Lift Check Valve (Angle)', 'Tilting Disc Check Valve',
  'Stop-Check Valve (Globe)', 'Stop-Check Valve (Angle)', 'Foot Valve w/ Strainer (Poppet)', 'Foot Valve w/ Strainer (Hinged)',
  'Standard Elbow 90°', 'Standard Elbow 45°', 'Standard Tee - Run', 'Standard Tee - Branch',
  'Close Pattern Return Bend', 'Sudden/Gradual Contraction', 'Sudden/Gradual Enlargement',
  'Pipe Entrance', 'Pipe Exit'
];
const FITTING_K = {
  'Gate Valve': {mult:8}, 'Globe Valve': {mult:340},
  'Angle Valve (K=55fT)': {mult:55}, 'Angle Valve (K=150fT)': {mult:150},
  'Ball Valve': {mult:3}, 'Plug Valve / Cock': {mult:18},
  'Butterfly Valve': {sizeMult:[{max:8,v:45},{max:14,v:35},{max:24,v:25}]},
  'Swing Check Valve (K=50fT)': {mult:50}, 'Swing Check Valve (K=100fT)': {mult:100},
  'Lift Check Valve (Globe)': {mult:600}, 'Lift Check Valve (Angle)': {mult:55},
  'Tilting Disc Check Valve': {sizeMult:[{max:8,v:40},{max:14,v:30}]},
  'Stop-Check Valve (Globe)': {mult:400}, 'Stop-Check Valve (Angle)': {mult:200},
  'Foot Valve w/ Strainer (Poppet)': {mult:420}, 'Foot Valve w/ Strainer (Hinged)': {mult:75},
  'Standard Elbow 90°': {mult:30}, 'Standard Elbow 45°': {mult:16},
  'Standard Tee - Run': {mult:20}, 'Standard Tee - Branch': {mult:60},
  'Close Pattern Return Bend': {mult:50},
  'Sudden/Gradual Contraction': {unsupported:true}, 'Sudden/Gradual Enlargement': {unsupported:true},
  'Pipe Entrance': {fixed:0.78}, 'Pipe Exit': {fixed:1.0}
};

let nodes = [];
let lines = [];
let fluidZones = {};
let nextId = 1;
const paletteButtons = {};

const REPORT_INFO_FIELDS = [
  {k:'client', l:'Client'}, {k:'plant', l:'Plant'}, {k:'project', l:'Project'},
  {k:'docNo', l:'Docum. No.'}, {k:'sheet', l:'Sheet'}, {k:'rev', l:'Rev.'}, {k:'item', l:'Item'}
];
let reportInfo = {};
const reportInfoWrap = document.getElementById('report-info-fields');
reportInfoWrap.innerHTML = REPORT_INFO_FIELDS.map(f =>
  '<div><label style="font-size:11px; color:var(--text-secondary); display:block; margin-bottom:3px;">'+f.l+'</label>' +

reportInfoWrap.querySelectorAll('input').forEach(inp => {

const palette = document.getElementById('palette');
PALETTE_GROUPS.forEach(group => {
  const row = document.createElement('div');

  label.style.cssText = 'font-size:11px; color:var(--text-muted); margin-bottom:5px;';

});
function updatePaletteState() {
  const starter = nodes.length === 0;
  Object.keys(paletteButtons).forEach(id => {
    const btn = paletteButtons[id];
    const allowed = !starter || STARTER_IDS.includes(id);
    btn.disabled = !allowed;
    btn.style.opacity = allowed ? '1' : '0.35';
    btn.style.cursor = allowed ? 'pointer' : 'not-allowed';
  });
}
updatePaletteState();

const chainWrap = document.getElementById('chain-wrap');
const formPanel = document.getElementById('form-panel');
const summaryPanel = document.getElementById('summary-panel');

function isComplete(fields, dataObj) {
  return fields.every(f => dataObj[f.k] !== undefined && dataObj[f.k] !== '');
}
function effectiveFields(def, idx) {
  const isStartBoundary = idx === 0;
  const isEndBoundary = idx === nodes.length - 1;
  let fields;
  if (def.roleFields) {
    fields = isStartBoundary ? sourceRoleFields : isEndBoundary ? destRoleFields : midRoleFields;
    if (def.extraFields) fields = fields.concat(def.extraFields);
  } else {
    fields = def.fields;
  }
  return fields;
}
function getZone(z) { if (!fluidZones[z]) fluidZones[z] = {}; return fluidZones[z]; }
function exchangerCountUpTo(idx) {
  let c = 0;
  for (let j = 0; j <= idx; j++) if (nodes[j] && nodes[j].type === 'exchanger') c++;
  return c;
}
function nodeZone(i) { return i === 0 ? 0 : exchangerCountUpTo(i - 1); }
function lineZone(k) { return exchangerCountUpTo(k); }

function addNode(typeId) {
  const node = {uid: nextId++, type: typeId, data: {}, tag: {}};
  if (nodes.length > 0) lines.push({uid: nextId++, data: {}, fittings: [], tag: {}});
  nodes.push(node);
  render();
  updatePaletteState();
}

function iconMarkup(type, color) {

function computeLineResult(line, zoneData) {
  const d = line.data;
  const idMm = d.nps ? pipeIdMm(d.schedule, d.nps) : null;
  const nomIn = d.nps ? NPS_NOMINAL_IN[d.nps] : null;
  const lengthM = parseFloat(d.length);
  const roughMm = parseFloat(d.roughness);
  const flowM3h = parseFloat(d.flow);
  const rho = parseFloat(zoneData.density);
  const muCp = parseFloat(zoneData.viscosity);
  if (!idMm || !lengthM || !flowM3h || !rho || !muCp || roughMm === undefined || isNaN(roughMm)) {
    return {ok:false, msg:'Select pipe schedule/size, pick a material, and enter length, flow and fluid density/viscosity to see results.'};
  }
  const ft = getFt(nomIn);
  let sumK = 0, unsupported = false;
  line.fittings.forEach(f => {
    const qty = parseFloat(f.qty) || 0;
    if (qty <= 0) return;
    const def = FITTING_K[f.type];
    if (!def) return;
    if (def.fixed !== undefined) sumK += def.fixed * qty;
    else if (def.mult !== undefined) sumK += def.mult * ft * qty;
    else if (def.sizeMult) {
      const m = def.sizeMult.find(s => nomIn <= s.max) || def.sizeMult[def.sizeMult.length-1];
      sumK += m.v * ft * qty;
    } else if (def.unsupported) unsupported = true;
  });

  const D = idMm / 1000;
  const area = Math.PI * D * D / 4;
  const Qm3s = flowM3h / 3600;
  const v = Qm3s / area;
  const mu = muCp / 1000;
  const Re = (rho * v * D) / mu;
  const relRough = (roughMm / 1000) / D;
  let f;
  if (Re < 2300 && Re > 0) f = 64 / Re;
  else if (Re >= 2300) f = 0.25 / Math.pow(Math.log10(relRough/3.7 + 5.74/Math.pow(Re,0.9)), 2);
  else f = null;

  if (!f || !isFinite(f)) return {ok:false, msg:'Could not resolve flow regime \u2014 check inputs.'};

  const totalRes = f * (lengthM / D) + sumK;
  const dpPa = totalRes * (rho * v * v) / 2;
  const dpBar = dpPa / 1e5;

  return {ok:true, v, Re, f, sumK, totalRes, dpBar, unsupported};
}

function computeTransitionResult(node, idx) {
  if (idx <= 0 || idx >= nodes.length - 1) return {ok:false, msg:'Place this between two connected lines so both adjacent line sizes are known.'};
  const dIn = pipeIdMm(lines[idx-1].data.schedule, lines[idx-1].data.nps);
  const dOut = pipeIdMm(lines[idx].data.schedule, lines[idx].data.nps);
  const transition = node.data.transition;
  if (!dIn || !dOut) return {ok:false, msg:'Set a line size on both the incoming and outgoing lines to compute \u03b2.'};
  if (!transition) return {ok:false, msg:'Choose Sudden or Gradual to compute K.'};
  const beta = Math.min(dIn, dOut) / Math.max(dIn, dOut);
  const isContraction = dOut < dIn;
  const thetaDeg = transition === 'Gradual' ? 30 : 180;
  const theta = thetaDeg * Math.PI / 180;
  let k2;
  if (isContraction) {
    k2 = transition === 'Gradual'
      ? 0.8 * Math.sin(theta/2) * (1 - beta*beta) / Math.pow(beta,4)
      : 0.5 * Math.sqrt(Math.sin(theta/2)) * (1 - beta*beta) / Math.pow(beta,4);
  } else {
    k2 = transition === 'Gradual'
      ? 2.6 * Math.sin(theta/2) * Math.pow(1 - beta*beta, 2) / Math.pow(beta,4)
      : Math.pow(1 - beta*beta, 2) / Math.pow(beta,4);
  }
  return {ok:true, beta, isContraction, thetaDeg, k2};
}
function transitionResultsHtml(node, idx) {
  const r = computeTransitionResult(node, idx);
  let html = '<div id="calc-results" style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border);">';
  html += '<p style="font-size:12px; color:var(--text-muted); margin:0 0 8px;">Results</p>';

  } else {

    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">\u03b2 (small/large)</td><td>' + r.beta.toFixed(3) + '</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">Actual type</td><td>' + (r.isContraction ? 'Contraction' : 'Enlargement') + '</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0; font-weight:500;">K2</td><td style="font-weight:500; color:'+BLUE+';">' + r.k2.toFixed(3) + '</td></tr>';
    const tr = computeTransitionDp(node, idx);
    if (tr.ok) html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0; font-weight:500;">Pressure drop</td><td style="font-weight:500; color:'+BLUE+';">' + tr.dpBar.toFixed(3) + ' bar</td></tr>';
    html += '</table>';
    html += '<p style="font-size:11px; color:var(--text-muted); margin-top:8px;">This pressure drop is included automatically in the Summary total.</p>';
  }
  html += '</div>';
  return html;
}
function updateTransitionResults(node, idx) {
  const el = document.getElementById('calc-results');
  if (!el) return;
  el.outerHTML = transitionResultsHtml(node, idx);
}

function computeTransitionDp(node, idx) {
  const r = computeTransitionResult(node, idx);
  if (!r.ok) return {ok:false};
  const refLineIdx = r.isContraction ? idx : idx - 1;
  const refLine = lines[refLineIdx];
  if (!refLine) return {ok:false};
  const zoneData = getZone(lineZone(refLineIdx));
  const rho = parseFloat(zoneData.density);
  const flowM3h = parseFloat(refLine.data.flow);
  const diamMm = pipeIdMm(refLine.data.schedule, refLine.data.nps);
  if (!rho || !flowM3h || !diamMm) return {ok:false};
  const D = diamMm / 1000;
  const area = Math.PI * D * D / 4;
  const v = (flowM3h / 3600) / area;
  const dpBar = (r.k2 * rho * v * v / 2) / 1e5;
  return {ok:true, dpBar};
}

// Keeps Flow in sync across suction line(s), the pump, and discharge line(s),
// since it's physically the same flow along one continuous path. Propagation
// stops at a Branch/Tee node in either direction, since flow can split there.
function propagateFlow(value, originNodeIdx, originLineIdx) {
  const total = nodes.length;
  const originPos = (originLineIdx != null) ? originLineIdx * 2 + 1 : originNodeIdx * 2;
  for (let pos = originPos - 1; pos >= 0; pos--) {
    if (pos % 2 === 0) {
      const nd = nodes[pos / 2];
      if (nd.type === 'branch') break;
      if (nd.type === 'pump') nd.data.flow = value;
    } else {
      lines[(pos - 1) / 2].data.flow = value;
    }
  }
  for (let pos = originPos + 1; pos < total * 2 - 1; pos++) {
    if (pos % 2 === 0) {
      const nd = nodes[pos / 2];
      if (nd.type === 'branch') break;
      if (nd.type === 'pump') nd.data.flow = value;
    } else {
      lines[(pos - 1) / 2].data.flow = value;
    }
  }
}

}

function showLineForm(line, idx) {
  const zoneIdx = lineZone(idx);
  openLineForm = {line, idx, zoneIdx};
  formPanel.style.display = 'block';
  let html = buildFieldsHtml([{k:'tag', l:'Line Number'}], line.tag, 'tag-field', true);
  html += processBlockHtml(zoneIdx, line);
  html += buildFieldsHtml(lineFieldsPre, line.data, 'spec-field');
  html += sizeModeBlockHtml(line);
  html += buildFieldsHtml(lineFieldsPost, line.data, 'spec-field');
  html += buildFittingsHtml(line.fittings);
  html += resultsHtml(line, getZone(zoneIdx));
  formPanel.innerHTML = html;

  formPanel.querySelectorAll('.tag-field').forEach(inp => {
    const fn = () => { line.tag[inp.dataset.key] = inp.value; };
    inp.oninput = fn; inp.onchange = fn;
  });
  formPanel.querySelectorAll('.spec-field').forEach(inp => {
    const fn = () => {
      line.data[inp.dataset.key] = inp.value;
      if (inp.dataset.key === 'flow') propagateFlow(inp.value, null, idx);
      if (line.data.sizeMode === 'byVelocity' && ['schedule','maxVelocity','flow'].includes(inp.dataset.key)) {
        showLineForm(line, idx);
        return;
      }
      render();
      updateResults(line, zoneIdx);
    };
    inp.oninput = fn; inp.onchange = fn;
  });
  const modeSel = formPanel.querySelector('.size-mode-select');
  if (modeSel) modeSel.onchange = () => { line.data.sizeMode = modeSel.value; showLineForm(line, idx); render(); };
  formPanel.querySelectorAll('.fitting-type').forEach(sel => {
    sel.onchange = () => { line.fittings[parseInt(sel.dataset.fidx)].type = sel.value; updateResults(line, zoneIdx); };
  });
  formPanel.querySelectorAll('.fitting-qty').forEach(inp => {
    inp.oninput = () => { line.fittings[parseInt(inp.dataset.fidx)].qty = inp.value; updateResults(line, zoneIdx); };
  });
  formPanel.querySelectorAll('.fitting-remove').forEach(btn => {
    btn.onclick = () => { line.fittings.splice(parseInt(btn.dataset.fidx), 1); showLineForm(line, idx); };
  });
  const addBtn = document.getElementById('fitting-add');
  if (addBtn) addBtn.onclick = () => { line.fittings.push({type: FITTING_TYPES[0], qty: ''}); showLineForm(line, idx); };
}

// Track whether the interaction started inside the form panel (mousedown fires
// before click). This avoids a false "outside click" close when a native
// <select>/<input> commits its value in a way that reports the click target as
// outside the panel (a common mobile/webview quirk with <select> pickers),
// which otherwise made the panel appear to slam shut and the page jump up.
let formPanelInteractionStarted = false;
formPanel.addEventListener('mousedown', () => { formPanelInteractionStarted = true; });
formPanel.addEventListener('touchstart', () => { formPanelInteractionStarted = true; });
const fluidZonesPanelEl = document.getElementById('fluid-zones-panel');
fluidZonesPanelEl.addEventListener('mousedown', () => { formPanelInteractionStarted = true; });
fluidZonesPanelEl.addEventListener('touchstart', () => { formPanelInteractionStarted = true; });

  render();
  updatePaletteState();
};

// ---- Final summary ----
function findPumpIdx() { return nodes.findIndex(n => n.type === 'pump'); }

function computeSummary() {
  const pumpIdx = findPumpIdx();
  if (pumpIdx === -1) return {ok:false, msg:'Add a Pump to the sequence to compute the summary.'};
  if (pumpIdx === 0 || pumpIdx === nodes.length - 1) return {ok:false, msg:'The pump needs at least one item before it (suction side) and one after it (discharge side).'};

  const startNode = nodes[0], endNode = nodes[nodes.length - 1], pumpNode = nodes[pumpIdx];
  if (!['tank','tower','misc'].includes(startNode.type) || !['tank','tower','misc'].includes(endNode.type)) {
    return {ok:false, msg:'The summary needs a Tank, Tower, or Miscellaneous (as a known-pressure boundary) at both the start and end of the sequence.'};
  }

  let sucLineDp = 0;
  for (let k = 0; k < pumpIdx; k++) {
    const r = computeLineResult(lines[k], getZone(lineZone(k)));
    if (!r.ok) return {ok:false, msg:'Fill in every suction line\'s specs to compute the summary.'};
    sucLineDp += r.dpBar;
  }
  let disLineDp = 0;
  for (let k = pumpIdx; k < lines.length; k++) {
    const r = computeLineResult(lines[k], getZone(lineZone(k)));
    if (!r.ok) return {ok:false, msg:'Fill in every discharge line\'s specs to compute the summary.'};
    disLineDp += r.dpBar;
  }

  let sucEquipDp = 0;
  for (let i = 1; i < pumpIdx; i++) {
    const nd = nodes[i];
    if (EQUIP_DP_TYPES.includes(nd.type)) sucEquipDp += parseFloat(nd.data.dp) || 0;
    else if (nd.type === 'reducer' || nd.type === 'enlarger') {
      const tr = computeTransitionDp(nd, i);
      if (!tr.ok) return {ok:false, msg:'Fill in every Reducer/Enlarger transition type and adjacent line sizes/flows to compute the summary.'};
      sucEquipDp += tr.dpBar;
    }
  }
  let disEquipDp = 0;
  for (let i = pumpIdx + 1; i < nodes.length - 1; i++) {
    const nd = nodes[i];
    if (EQUIP_DP_TYPES.includes(nd.type)) disEquipDp += parseFloat(nd.data.dp) || 0;
    else if (nd.type === 'reducer' || nd.type === 'enlarger') {
      const tr = computeTransitionDp(nd, i);
      if (!tr.ok) return {ok:false, msg:'Fill in every Reducer/Enlarger transition type and adjacent line sizes/flows to compute the summary.'};
      disEquipDp += tr.dpBar;
    }
  }
  const sucDp = sucLineDp + sucEquipDp;
  const disDp = disLineDp + disEquipDp;

  // Suction-side fluid properties come from the zone at the pump (accounts for an
  // exchanger sitting between the start tank and the pump); discharge-side fluid
  // properties come from the zone at the destination (accounts for an exchanger
  // sitting between the pump and the destination tank/tower).
  const sucZone = getZone(nodeZone(pumpIdx));
  const disZone = getZone(nodeZone(nodes.length - 1));
  const sucRho = parseFloat(sucZone.density);
  const disRho = parseFloat(disZone.density);
  const vapor = parseFloat(sucZone.vapor);
  if (!sucRho) return {ok:false, msg:'Set fluid density for the suction-side zone to compute the summary.'};
  if (!disRho) return {ok:false, msg:'Set fluid density for the discharge-side zone to compute the summary.'};

  const g = 9.81;
  const elevPump = parseFloat(pumpNode.data.elevation) || 0;
  const suctionNozzleOffset = (pumpNode.data.suction_nozzle_elev !== undefined && pumpNode.data.suction_nozzle_elev !== '') ? parseFloat(pumpNode.data.suction_nozzle_elev) : 0;
  const elevPumpSuctionNozzle = elevPump + suctionNozzleOffset;
  const elevStart = parseFloat(startNode.data.elevation) || 0;
  const endNozzleOffset = (endNode.data.nozzle_elev_in !== undefined && endNode.data.nozzle_elev_in !== '') ? parseFloat(endNode.data.nozzle_elev_in) : 0;
  const destNozzleElev = (parseFloat(endNode.data.elevation) || 0) + endNozzleOffset;
  // Conservative/standard practice: if a High Point along the discharge path
  // (e.g. a pipe rack the line crosses) sits above the destination nozzle,
  // the pump must be sized to reach that higher point instead — a full
  // liquid-filled pipe's TOTAL static head only depends on the two
  // endpoints, but designing to the highest point avoids any risk of vapor
  // lock/column separation at that point without needing a separate
  // pressure-profile check.
  let elevEndNozzle = destNozzleElev;
  for (let i = pumpIdx + 1; i < nodes.length; i++) {
    if (nodes[i].type === 'point') {
      const hp = parseFloat(nodes[i].data.elevation);
      if (!isNaN(hp) && hp > elevEndNozzle) elevEndNozzle = hp;
    }
  }
  const llll = (startNode.data.llll !== undefined && startNode.data.llll !== '') ? parseFloat(startNode.data.llll) : elevStart;
  const hhll = (startNode.data.hhll !== undefined && startNode.data.hhll !== '') ? parseFloat(startNode.data.hhll) : elevStart;

  const suctionOpPress = parseFloat(startNode.data.opress);
  const suctionDesPress = parseFloat(startNode.data.despress);
  const destOpPress = parseFloat(endNode.data.opress);
  if (isNaN(suctionOpPress) || isNaN(destOpPress)) {
    return {ok:false, msg:'Set Operating pressure on both the first and last equipment (Tank/Tower) to compute the summary.'};
  }

  const staticHeadSuction = llll - elevPumpSuctionNozzle;
  const staticHeadDischarge = elevEndNozzle - elevPump;

  const suctionPress = suctionOpPress + (sucRho*g*staticHeadSuction)/1e5 - sucDp;
  const dischargePress = destOpPress + (disRho*g*staticHeadDischarge)/1e5 + disDp;

  const pumpDpCalc = dischargePress - suctionPress;
  const tdh = (pumpDpCalc * 1e5) / (sucRho * g);

  const suctionDesignForMax = !isNaN(suctionDesPress) ? suctionDesPress : suctionOpPress;
  const maxSuctionHeadM = hhll - elevPumpSuctionNozzle;
  const maxSuctionPressure = (sucRho*g*maxSuctionHeadM)/1e5 + suctionDesignForMax;
  const shutoffPressure = maxSuctionPressure + pumpDpCalc;

  let npsha = null;
  if (!isNaN(vapor)) {
    npsha = ((suctionOpPress - vapor) * 1e5) / (sucRho * g) + staticHeadSuction - (sucDp * 1e5) / (sucRho * g);
  }
  const npshr = parseFloat(pumpNode.data.npshr);
  const npshMargin = (npsha !== null && !isNaN(npshr)) ? (npsha - npshr) : null;

  const flow = parseFloat(pumpNode.data.flow);
  const effP = parseFloat(pumpNode.data.effp);
  const effM = parseFloat(pumpNode.data.effm);
  let hydraulicPower = null, bhp = null, absorbedPower = null;
  if (flow) {
    hydraulicPower = (flow * pumpDpCalc) / 36;
    if (effP) bhp = hydraulicPower / (effP/100);
    if (bhp !== null && effM) absorbedPower = bhp / (effM/100);
  }

  return {ok:true, sucLineDp, sucEquipDp, sucDp, disLineDp, disEquipDp, disDp, suctionPress, dischargePress,
    pumpDpCalc, maxSuctionPressure, shutoffPressure, tdh, npsha, npshr, npshMargin,
    hydraulicPower, bhp, absorbedPower, staticHeadSuction, staticHeadDischarge,
    governingDischargeElev: elevEndNozzle, destNozzleElev, highPointGoverns: elevEndNozzle > destNozzleElev};
}

function fmt(v, d) { return (v===null || v===undefined || isNaN(v)) ? '\u2014' : v.toFixed(d===undefined?2:d); }

function summaryHtml() {
  const r = computeSummary();
  let html = '<p style="font-size:14px; font-weight:500; margin:0 0 14px;">Summary</p>';
  if (!r.ok) {
    html += '<p style="font-size:13px; color:var(--text-secondary);">' + r.msg + '</p>';
    return html;
  }
  function row(label, val, unit) {
    return '<tr><td style="color:var(--text-secondary); padding:3px 16px 3px 0;">'+label+'</td><td style="font-weight:500;">'+val+(unit?' '+unit:'')+'</td></tr>';
  }
  html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">';
  html += '<div><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">SUCTION</p><table style="font-size:13px;">';
  html += row('Line friction DP', fmt(r.sucLineDp,3), 'bar');
  html += row('Equipment DP', fmt(r.sucEquipDp,3), 'bar');
  html += row('Total suction DP', fmt(r.sucDp,3), 'bar');
  html += row('Static head (LLLL \u2192 pump)', fmt(r.staticHeadSuction,2), 'm');
  html += row('Suction pressure at pump', fmt(r.suctionPress,3), 'bara');
  html += row('NPSH available', fmt(r.npsha,2), 'm');
  html += row('NPSH required', fmt(r.npshr,2), 'm');
  html += row('NPSH margin', fmt(r.npshMargin,2), 'm');
  html += '</table></div>';
  html += '<div><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">DISCHARGE</p><table style="font-size:13px;">';
  html += row('Line friction DP', fmt(r.disLineDp,3), 'bar');
  html += row('Equipment DP', fmt(r.disEquipDp,3), 'bar');
  html += row('Total discharge DP', fmt(r.disDp,3), 'bar');
  html += row('Static head (pump \u2192 delivery)', fmt(r.staticHeadDischarge,2), 'm');
  html += row('Discharge pressure at QD', fmt(r.dischargePress,3), 'bara');
  html += '</table></div>';
  html += '</div>';

  const pumpIdxS = findPumpIdx();
  function lineBreakdownHtml(fromK, toK) {
    let t = '<table style="font-size:12px; width:100%;"><tr><th style="text-align:left;">Line</th><th style="text-align:left;">Size</th><th style="text-align:left;">V (m/s)</th><th style="text-align:left;">DP (bar)</th><th style="text-align:left;">Fittings (\u03a3K included)</th></tr>';
    for (let k = fromK; k < toK; k++) {
      const row = lineReportRow(k);
      t += '<tr><td>'+row.tag+'</td><td>'+(row.nps||'\u2014')+'</td><td>'+fmt(row.velocity,2)+'</td><td>'+fmt(row.dpBar,3)+'</td><td>'+row.fittings+'</td></tr>';
    }
    t += '</table>';
    return t;
  }
  html += '<div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">SUCTION LINES &amp; FITTINGS</p>' + lineBreakdownHtml(0, pumpIdxS) + '</div>';
  html += '<div style="margin-top:12px;"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">DISCHARGE LINES &amp; FITTINGS</p>' + lineBreakdownHtml(pumpIdxS, lines.length) + '</div>';
  html += '<div style="margin-top:12px;"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">SUCTION IN-LINE EQUIPMENT (control valves, orifices, filters, misc.)</p>' + equipRowsHtml(1, pumpIdxS) + '</div>';
  html += '<div style="margin-top:12px;"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">DISCHARGE IN-LINE EQUIPMENT (control valves, orifices, filters, misc.)</p>' + equipRowsHtml(pumpIdxS+1, nodes.length-1) + '</div>';
  html += '<p style="font-size:11px; color:var(--text-muted); margin-top:10px;">The \u03a3K of the fittings listed above for each line is already included in that line\u2019s DP and in the totals above \u2014 nothing further to add.</p>';

  html += '<div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">PUMP CHARACTERISTICS</p>';
  html += '<table style="font-size:13px; width:100%;">';
  html += row('Pump DP calc. (diff. press at Qd)', fmt(r.pumpDpCalc,3), 'bar');
  html += row('Maximum suction pressure', fmt(r.maxSuctionPressure,3), 'bara');
  html += row('Pump shut-off / design pressure', fmt(r.shutoffPressure,3), 'bara');
  html += row('TDH', fmt(r.tdh,1), 'm');
  html += row('Hydraulic power', fmt(r.hydraulicPower,2), 'kW');
  html += row('BHP', fmt(r.bhp,2), 'kW');
  html += row('Absorbed power', fmt(r.absorbedPower,2), 'kW');
  html += '</table></div>';
  return html;
}

document.getElementById('summary-btn').onclick = (e) => {
  e.stopPropagation();
  summaryPanel.innerHTML = summaryHtml();
  summaryPanel.style.display = 'block';
};

function fmtR(v, d) { return (v===null || v===undefined || isNaN(v)) ? '' : v.toFixed(d===undefined?2:d); }

function fittingsSummary(line) {
  if (!line.fittings.length) return '\u2014';
  return line.fittings.filter(f => f.qty).map(f => (f.qty||'') + '\u00d7 ' + f.type).join(', ');
}

function lineReportRow(k) {
  const line = lines[k];
  const zoneData = getZone(lineZone(k));
  const r = computeLineResult(line, zoneData);
  const lengthM = parseFloat(line.data.length);
  const specificDpBarKm = (r.ok && lengthM) ? (r.dpBar/lengthM)*1000 : null;
  return {
    tag: (line.tag && line.tag.tag) ? line.tag.tag : ('Line ' + (k+1)),
    nps: line.data.nps ? (line.data.nps + (line.data.schedule ? ' (Sch '+line.data.schedule+')' : '')) : '', volFlow: line.data.flow,
    velocity: r.ok ? r.v : null, length: lengthM, specificDpBarKm,
    dpBar: r.ok ? r.dpBar : null, fittings: fittingsSummary(line)
  };
}

function equipRowsHtml(fromI, toI) {
  let t = '<table><tr><th>Tag</th><th>Type</th><th>Pressure drop (bar)</th></tr>';
  let any = false;
  for (let i = fromI; i < toI; i++) {
    const nd = nodes[i];
    let dpVal = null;
    if (EQUIP_DP_TYPES.includes(nd.type)) dpVal = parseFloat(nd.data.dp) || 0;
    else if (nd.type === 'reducer' || nd.type === 'enlarger') { const tr = computeTransitionDp(nd, i); dpVal = tr.ok ? tr.dpBar : 0; }
    if (dpVal === null) continue;
    any = true;
    const tag = (nd.tag && nd.tag.tag) ? nd.tag.tag : '\u2014';
    t += '<tr><td>' + tag + '</td><td>' + equipDefs[nd.type].label + '</td><td>' + fmtR(dpVal,3) + '</td></tr>';
  }
  t += '</table>';
  return any ? t : '<p style="font-size:11px; color:#666;">None</p>';
}

function buildReportHtml() {
  const r = computeSummary();
  const pumpIdx = findPumpIdx();
  let html = '<table class="rpt-header-table"><tr>' +
    '<td style="width:55%;"><b>CLIENT:</b> ' + (reportInfo.client||'') + '<br><b>PLANT:</b> ' + (reportInfo.plant||'') + '</td>' +
    '<td><b>Project:</b> ' + (reportInfo.project||'') + '<br><b>Docum.:</b> ' + (reportInfo.docNo||'') + '<br><b>Sheet:</b> ' + (reportInfo.sheet||'') + '<br><b>Rev.:</b> ' + (reportInfo.rev||'') + '</td>' +
    '</tr></table>';
  html += '<h2 style="text-align:center;">CALCULATION SHEET FOR PUMPS' + (reportInfo.item ? (' \u2014 Item: ' + reportInfo.item) : '') + '</h2>';

  const diagramSvg = chainWrap.innerHTML.replace(/<svg width="\d+" height="\d+"/, '<svg width="100%" height="auto"');
  html += '<div class="rpt-section-title">EQUIPMENT SEQUENCE DIAGRAM</div>';
  html += '<div style="border:1px solid #999; padding:6px; margin-bottom:4px;">' + diagramSvg + '</div>';

  if (!r.ok) {
    html += '<p>' + r.msg + '</p>';
    return html;
  }

  const startNode = nodes[0], endNode = nodes[nodes.length-1], pumpNode = nodes[pumpIdx];
  const sucZone = getZone(nodeZone(pumpIdx));
  const disZone = getZone(nodeZone(nodes.length - 1));
  const endNozzleOffsetR = (endNode.data.nozzle_elev_in !== undefined && endNode.data.nozzle_elev_in !== '') ? parseFloat(endNode.data.nozzle_elev_in) : 0;
  const endElev = (parseFloat(endNode.data.elevation) || 0) + endNozzleOffsetR;

  html += '<div class="rpt-section-title">1. BASIC DATA</div><table>';
  html += '<tr><td>Liquid Density (suction)</td><td>' + fmtR(parseFloat(sucZone.density),1) + ' kg/m3</td><td>Liquid Density (discharge)</td><td>' + fmtR(parseFloat(disZone.density),1) + ' kg/m3</td></tr>';
  html += '<tr><td>Viscosity (suction)</td><td>' + fmtR(parseFloat(sucZone.viscosity),2) + ' cP</td><td>Viscosity (discharge)</td><td>' + fmtR(parseFloat(disZone.viscosity),2) + ' cP</td></tr>';
  html += '<tr><td>Vapor Pressure (suction)</td><td>' + fmtR(parseFloat(sucZone.vapor),3) + ' bar(a)</td><td>Pump Capacity [Qd]</td><td>' + fmtR(parseFloat(pumpNode.data.flow),1) + ' m3/h</td></tr>';
  html += '</table>';

  html += '<div class="rpt-section-title">2. VESSEL DATA</div>';
  html += '<table><tr><th></th><th>Suction Vessel</th><th>Delivery Vessel</th></tr>';
  const vTag = (n) => (n.tag && n.tag.tag) ? n.tag.tag : '\u2014';
  html += '<tr><td>Tag</td><td>' + vTag(startNode) + '</td><td>' + vTag(endNode) + '</td></tr>';
  html += '<tr><td>Type</td><td>' + equipDefs[startNode.type].label + '</td><td>' + equipDefs[endNode.type].label + '</td></tr>';
  html += '<tr><td>Installation Elevation (m)</td><td>' + fmtR(parseFloat(startNode.data.elevation),2) + '</td><td>' + fmtR(parseFloat(endNode.data.elevation),2) + '</td></tr>';
  const startNozzleOffsetR = (startNode.data.nozzle_elev_out !== undefined && startNode.data.nozzle_elev_out !== '') ? parseFloat(startNode.data.nozzle_elev_out) : null;
  html += '<tr><td>Nozzle Elevation Above Base (m)</td><td>' + (startNozzleOffsetR!==null ? fmtR(startNozzleOffsetR,2) : '\u2014') + '</td><td>' + fmtR(endNozzleOffsetR,2) + '</td></tr>';
  html += '<tr><td>Effective Inlet Nozzle Elevation (m)</td><td>\u2014</td><td>' + fmtR(parseFloat(endElev),2) + '</td></tr>';
  if (r.highPointGoverns) {
    html += '<tr><td colspan="4" style="color:#9C3A32;"><b>Note:</b> A High Point along the discharge path (' + fmtR(r.governingDischargeElev,2) + ' m) is higher than the destination nozzle \u2014 the pump was sized to reach that elevation instead (conservative practice).</td></tr>';
  }
  ['hhll','llll'].forEach(k => {
    const sv = startNode.data[k], ev = endNode.data[k];
    if (sv === undefined && ev === undefined) return;
    html += '<tr><td>' + k.toUpperCase() + ' (m)</td><td>' + (sv!==undefined && sv!=='' ? fmtR(parseFloat(sv),2) : '\u2014') + '</td><td>' + (ev!==undefined && ev!=='' ? fmtR(parseFloat(ev),2) : '\u2014') + '</td></tr>';
  });
  html += '<tr><td>Operating Pressure (bar a)</td><td>' + fmtR(parseFloat(startNode.data.opress),3) + '</td><td>' + fmtR(parseFloat(endNode.data.opress),3) + '</td></tr>';
  html += '<tr><td>Design Pressure (bar a)</td><td>' + (startNode.data.despress!==undefined && startNode.data.despress!=='' ? fmtR(parseFloat(startNode.data.despress),3) : '\u2014') + '</td><td>' + (endNode.data.despress!==undefined && endNode.data.despress!=='' ? fmtR(parseFloat(endNode.data.despress),3) : '\u2014') + '</td></tr>';
  html += '</table>';

  html += '<div class="rpt-section-title">3. LINE PRESSURE DROP</div>';
  function lineRowsHtml(fromK, toK) {
    let t = '<table><tr><th>Line</th><th>NPS (in)</th><th>Flow (m3/h)</th><th>Velocity (m/s)</th><th>Length (m)</th><th>Specific DP (bar/km)</th><th>Line DP (bar)</th><th>Fittings</th></tr>';
    for (let k = fromK; k < toK; k++) {
      const row = lineReportRow(k);
      t += '<tr><td>' + row.tag + '</td><td>' + (row.nps||'') + '</td><td>' + fmtR(parseFloat(row.volFlow),1) + '</td><td>' + fmtR(row.velocity,2) + '</td><td>' + fmtR(row.length,1) + '</td><td>' + fmtR(row.specificDpBarKm,3) + '</td><td>' + fmtR(row.dpBar,3) + '</td><td>' + row.fittings + '</td></tr>';
    }
    t += '</table>';
    return t;
  }
  html += '<p style="font-weight:600; margin:6px 0 2px;">Suction lines</p>' + lineRowsHtml(0, pumpIdx);
  html += '<p style="font-weight:600; margin:6px 0 2px;">Discharge lines</p>' + lineRowsHtml(pumpIdx, lines.length);
  html += '<p style="font-weight:600; margin:6px 0 2px;">Suction In-line Equipment (control valves, orifices, filters, misc.)</p>' + equipRowsHtml(1, pumpIdx);
  html += '<p style="font-weight:600; margin:6px 0 2px;">Discharge In-line Equipment (control valves, orifices, filters, misc.)</p>' + equipRowsHtml(pumpIdx+1, nodes.length-1);
  html += '<table style="margin-top:4px;"><tr><td>Total Suction DP</td><td>' + fmtR(r.sucDp,3) + ' bar</td><td>Total Discharge DP</td><td>' + fmtR(r.disDp,3) + ' bar</td></tr></table>';

  html += '<div class="rpt-section-title">4. HYDRAULIC RESULTS</div><table>';
  html += '<tr><td>Height of Pump Centerline</td><td>' + fmtR(parseFloat(pumpNode.data.elevation),2) + ' m</td><td>Discharge Pressure at QD</td><td>' + fmtR(r.dischargePress,3) + ' bar(a)</td></tr>';
  html += '<tr><td>Suction Nozzle Elevation Above Base</td><td>' + (pumpNode.data.suction_nozzle_elev!==undefined && pumpNode.data.suction_nozzle_elev!=='' ? fmtR(parseFloat(pumpNode.data.suction_nozzle_elev),2)+' m' : '\u2014') + '</td><td>&nbsp;</td><td>&nbsp;</td></tr>';
  html += '<tr><td>Suction Pressure at Pump</td><td>' + fmtR(r.suctionPress,3) + ' bar(a)</td><td>Pump Shut-off / Design Pressure</td><td>' + fmtR(r.shutoffPressure,3) + ' bar(a)</td></tr>';
  html += '<tr><td>NPSH Available</td><td>' + fmtR(r.npsha,2) + ' m</td><td>NPSH Required</td><td>' + fmtR(r.npshr,2) + ' m</td></tr>';
  html += '</table>';

  html += '<div class="rpt-section-title">5. PUMP CHARACTERISTICS</div><table>';
  html += '<tr><td>Pump DP Calc.</td><td>' + fmtR(r.pumpDpCalc,3) + ' bar</td><td>TDH</td><td>' + fmtR(r.tdh,1) + ' m</td></tr>';
  html += '<tr><td>Pump Efficiency</td><td>' + fmtR(parseFloat(pumpNode.data.effp),1) + ' %</td><td>Hydraulic Power</td><td>' + fmtR(r.hydraulicPower,2) + ' kW</td></tr>';
  html += '<tr><td>Motor Efficiency</td><td>' + fmtR(parseFloat(pumpNode.data.effm),1) + ' %</td><td>BHP</td><td>' + fmtR(r.bhp,2) + ' kW</td></tr>';
  html += '<tr><td>&nbsp;</td><td>&nbsp;</td><td>Absorbed Power</td><td>' + fmtR(r.absorbedPower,2) + ' kW</td></tr>';
  html += '</table>';

  let anyTransitionNotes = '';
  nodes.forEach((nd, i) => {
    if (nd.type === 'reducer' || nd.type === 'enlarger') {
      const tr = computeTransitionResult(nd, i);
      if (tr.ok) anyTransitionNotes += '<p style="font-size:10px; margin:2px 0;">' + equipDefs[nd.type].label + ' at ' + ((nd.tag && nd.tag.tag) ? nd.tag.tag : ('#'+i)) + ': K2 = ' + tr.k2.toFixed(3) + ' (' + nd.data.transition + ')</p>';
    }
  });
  if (anyTransitionNotes) html += '<div style="margin-top:6px;">' + anyTransitionNotes + '</div>';

  return html;
}

document.getElementById('pdf-btn').onclick = (e) => {
  e.stopPropagation();
  const printReport = document.getElementById('print-report');
  printReport.innerHTML = buildReportHtml();
  printReport.style.display = 'block';
  window.print();
};

render();
</script>
</body>
</html>
