const PIPE_NPS_OPTIONS = PIPE_SIZES[40].map(p => p.nps);

const PALETTE_GROUPS = [

// Picks the smallest NPS (in the given schedule) whose actual internal
// diameter keeps velocity at or below the target — used by the "size by
// velocity" mode as an alternative to manually choosing a pipe size.
function pickNpsByVelocity(schedule, flowM3h, maxVelocity) {
  const table = PIPE_SIZES[schedule] || PIPE_SIZES[40];
  const Qm3s = flowM3h / 3600;
  for (let i = 0; i < table.length; i++) {
    const idM = table[i].d / 1000;
    const area = Math.PI * idM * idM / 4;
    const v = Qm3s / area;
    if (v <= maxVelocity) return {nps: table[i].nps, velocity: v};
  }
  const last = table[table.length - 1];
  const idM = last.d / 1000;
  const v = Qm3s / (Math.PI * idM * idM / 4);
  return {nps: last.nps, velocity: v, oversized: true};
}

function sizeModeBlockHtml(line) {
  const mode = line.data.sizeMode || 'manual';
  let html = '<div style="margin:10px 0; padding:10px; border:1px solid var(--border); border-radius:var(--r-sm); max-width:260px;">';
  html += '<label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px;">Pipe size</label>';
  html += '<select class="size-mode-select" style="width:100%; margin-bottom:8px;">' +
    '<option value="manual"' + (mode==='manual'?' selected':'') + '>Choose NPS manually</option>' +
    '<option value="byVelocity"' + (mode==='byVelocity'?' selected':'') + '>Size by max velocity</option>' +
    '</select>';
  if (mode === 'manual') {
    html += buildFieldsHtml([{k:'nps', l:'Pipe size (NPS)', select: PIPE_NPS_OPTIONS}], line.data, 'spec-field', true);
  } else {
    html += buildFieldsHtml([{k:'maxVelocity', l:'Max allowable velocity (m/s)', num:true}], line.data, 'spec-field', true);
    const flowVal = parseFloat(line.data.flow);
    const maxV = parseFloat(line.data.maxVelocity);
    if (flowVal && maxV) {
      const picked = pickNpsByVelocity(line.data.schedule || '40', flowVal, maxV);
      line.data.nps = picked.nps;
      html += '<p style="font-size:11px; color:var(--text-muted); margin:6px 0 0;">Picked size: <b style="color:var(--text-accent);">' + picked.nps + '</b> \u2014 actual velocity ' + picked.velocity.toFixed(2) + ' m/s' + (picked.oversized ? ' (largest available size still exceeds target)' : '') + '</p>';
    } else {
      html += '<p style="font-size:11px; color:var(--text-muted); margin:6px 0 0;">Enter flow and a target velocity to auto-pick a size.</p>';
    }
  }
  html += '</div>';
  return html;
}

const FT_TABLE = [
  {size:0.5, ft:.027},{size:0.75, ft:.025},{size:1, ft:.023},{size:1.25, ft:.022},{size:1.5, ft:.021},
  {size:2, ft:.019},{size:2.5, ft:.018},{size:3, ft:.018},{size:4, ft:.017},{size:5, ft:.016},
  {size:6, ft:.015},{size:8, ft:.014},{size:10, ft:.014},{size:12, ft:.013},{size:14, ft:.013},
  {size:16, ft:.013},{size:18, ft:.012},{size:20, ft:.012},{size:24, ft:.012}
];
function getFt(sizeIn) {
  if (!sizeIn || sizeIn <= 0) return null;
  let best = FT_TABLE[0], bestDiff = Infinity;
  FT_TABLE.forEach(r => { const d = Math.abs(r.size - sizeIn); if (d < bestDiff) { bestDiff = d; best = r; } });
  return best.ft;
}

function updatePaletteState() {

  Object.keys(paletteButtons).forEach(id => {

    btn.disabled = !allowed;

function isComplete(fields, dataObj) {
  return fields.every(f => f.optional || (dataObj[f.k] !== undefined && dataObj[f.k] !== ''));
}
function effectiveFields(def, idx) {
  const isStartBoundary = idx === 0;
  const isEndBoundary = idx === nodes.length - 1;
  let fields;
  if (def.roleFields) {
    fields = isStartBoundary ? sourceRoleFields : isEndBoundary ? destRoleFields : midRoleFields;
    if (def.extraFields) fields = fields.concat(def.extraFields);
  } else {
    fields = def.fields;
  }
  return fields;
}
function getZone(z) { if (!fluidZones[z]) fluidZones[z] = {}; return fluidZones[z]; }
function exchangerCountUpTo(idx) {
  let c = 0;
  for (let j = 0; j <= idx; j++) if (nodes[j] && nodes[j].type === 'exchanger') c++;
  return c;
}
function nodeZone(i) { return i === 0 ? 0 : exchangerCountUpTo(i - 1); }
function lineZone(k) { return exchangerCountUpTo(k); }

function addNode(typeId) {
  const node = {uid: nextId++, type: typeId, data: {}, tag: {}};
  if (nodes.length > 0) lines.push({uid: nextId++, data: {}, fittings: [], tag: {}});
  nodes.push(node);
  render();
  updatePaletteState();
}

  if (type === 'pump') return '<circle cx="0" cy="-6" r="15" fill="none" stroke="'+color+'" stroke-width="3"/><path d="M-10,6 L10,6 L19,20 L-19,20 Z" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round"/>';
  if (type === 'valve') return '<path d="M-16,-14 L0,0 L-16,14 Z" fill="'+color+'"/><path d="M16,-14 L0,0 L16,14 Z" fill="'+color+'"/><rect x="-6" y="-27" width="12" height="10" rx="2" fill="'+color+'"/><line x1="0" y1="-17" x2="0" y2="-14" stroke="'+color+'" stroke-width="2"/>';
  if (type === 'exchanger') return '<circle cx="0" cy="0" r="16" fill="none" stroke="'+color+'" stroke-width="2.5"/><path d="M-9,7 L-3,-6 L3,7 L9,-7" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="-21" y1="21" x2="18" y2="-18" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow2)"/>';
  if (type === 'point') return '<circle cx="0" cy="0" r="16" fill="none" stroke="'+color+'" stroke-width="3.5"/><line x1="-9" y1="0" x2="9" y2="0" stroke="'+color+'" stroke-width="2.5"/>';
  if (type === 'tower') return '<rect x="-14" y="-28" width="28" height="56" rx="14" ry="14" fill="none" stroke="'+color+'" stroke-width="2.5"/><line x1="-14" y1="-18" x2="9" y2="-18" stroke="'+color+'" stroke-width="1.5"/><line x1="-8" y1="-10" x2="14" y2="-10" stroke="'+color+'" stroke-width="1.5"/><line x1="-14" y1="-2" x2="9" y2="-2" stroke="'+color+'" stroke-width="1.5"/><line x1="-8" y1="6" x2="14" y2="6" stroke="'+color+'" stroke-width="1.5"/><line x1="-14" y1="14" x2="9" y2="14" stroke="'+color+'" stroke-width="1.5"/><line x1="-8" y1="22" x2="14" y2="22" stroke="'+color+'" stroke-width="1.5"/>';
  if (type === 'reducer') return '<polygon points="-18,-16 18,-8 18,8 -18,16" fill="'+color+'"/>';
  if (type === 'enlarger') return '<polygon points="-18,-8 18,-16 18,16 -18,8" fill="'+color+'"/>';
  if (type === 'branch') return '<polygon points="0,-16 16,0 0,16 -16,0" fill="'+color+'"/>';
  if (type === 'filter') return '<path d="M-14,-18 L-14,4 A14,14 0 0,0 14,4 L14,-18" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/><line x1="-8" y1="-11" x2="7" y2="1" stroke="'+color+'" stroke-width="2.5" stroke-dasharray="4,3.2" stroke-linecap="round"/>';
  if (type === 'misc') return '<rect x="-16" y="-16" width="32" height="32" rx="6" fill="'+color+'"/>';
  if (type === 'orifice') return '<circle cx="0" cy="0" r="16" fill="'+color+'"/><rect x="-3" y="-16" width="6" height="32" fill="var(--surface-2)"/>';
  if (type === 'flowtx') return '<circle cx="0" cy="0" r="16" fill="none" stroke="'+color+'" stroke-width="3.5"/><text x="0" y="4" text-anchor="middle" style="font-size:11px; fill:'+color+'; font-weight:600;">F</text>';
  return '';
}
function badgeMarkup(complete, color) {
  const symbol = complete ? '\u2713' : '\u2715';
  return '<circle cx="20" cy="-20" r="8" fill="var(--surface-2)" stroke="'+color+'" stroke-width="1.5"/><text x="20" y="-16.5" text-anchor="middle" style="font-size:10px; fill:'+color+';">'+symbol+'</text>';
}

// Derives Flow for every line and the pump from each zone's base Flow
// (entered once per zone, alongside density/viscosity) plus any Tee (Branch)
// nodes encountered along the way: a Tee's dQ is added (positive) or
// subtracted (negative) from the running flow for everything downstream of
// it, until the next zone boundary (exchanger) resets to that zone's own
// base Flow. Writes results into line.data.flow / pump node.data.flow so
// all existing flow-consuming code (line/transition dP calcs, summary,
// report) keeps working unchanged.
// Generic version of the flow walk: derives the flow on every line from a
// given per-zone base-flow key (e.g. 'flow' for Normal, 'qMin'/'qMax' for
// the min/max cases) plus each Tee's \u0394Flow (applied as the same absolute
// value regardless of case \u2014 a fixed extra/branched stream, not assumed
// proportional to the main flow). Returns a plain array parallel to
// `lines`; does not mutate anything.
function computeFlowMapForBase(baseKey) {
  let current = null;
  const lineFlow = [];
  for (let k = 0; k < lines.length; k++) {
    const z = lineZone(k);
    const nodeBefore = nodes[k];
    if (k === 0 || lineZone(k - 1) !== z) {
      const base = parseFloat(getZone(z)[baseKey]);
      current = isNaN(base) ? null : base;
    } else if (nodeBefore.type === 'branch') {
      const dq = parseFloat(nodeBefore.data.dq);
      if (current !== null && !isNaN(dq)) current = current + dq;
    }
    lineFlow[k] = current;
  }
  return lineFlow;
}
// Flow (local, at a node's position) for a given lineFlow array, matching
// the convention used to derive the pump's own flow in computeFlowMap().
function nodeLocalFlow(i, lineFlowArr) {
  const v = (i < lines.length) ? lineFlowArr[i] : lineFlowArr[i - 1];
  return (v === undefined || v === null || v === '' || isNaN(v)) ? null : v;
}

// Derives Flow for every line and the pump from each zone's base Flow
// (entered once per zone, alongside density/viscosity) plus any Tee (Branch)
// nodes encountered along the way: a Tee's dQ is added (positive) or
// subtracted (negative) from the running flow for everything downstream of
// it, until the next zone boundary (exchanger) resets to that zone's own
// base Flow. Writes results into line.data.flow / pump node.data.flow so
// all existing flow-consuming code (line/transition dP calcs, summary,
// report) keeps working unchanged.
function computeFlowMap() {
  const lineFlow = computeFlowMapForBase('flow');
  for (let k = 0; k < lines.length; k++) {
    lines[k].data.flow = (lineFlow[k] !== null) ? lineFlow[k] : '';
  }
  for (let i = 0; i < nodes.length; i++) {
    if (nodes[i].type !== 'pump') continue;
    const f = nodeLocalFlow(i, lineFlow);
    nodes[i].data.flow = (f !== null) ? f : '';
  }
}

function render() {
  computeFlowMap();
  renderFluidZonesPanel();
  summaryPanel.innerHTML = summaryHtml();
  renderChain();
}

// Draws just the equipment-sequence SVG (icons + line segments) and wires
// up its click handlers. Split out from render() so that handlers needing
// to refresh line colors / the diagram (e.g. after a zone Flow field
// changes) don't have to rebuild the fluid-zones panel too \u2014 which would
// blow away focus on whichever zone input the user is mid-typing in.
function renderChain() {
  const spacing = 150, marginX = 130, baseY = 220, scale = 7, maxOff = 110;
  const n = nodes.length;
  const svgWidth = Math.max(480, marginX + 60 + (n-1)*spacing);
  const svgHeight = 480;

  const positions = nodes.map((node, i) => {
    const elev = parseFloat(node.data.elevation) || 0;
    let off = elev * scale;
    if (off > maxOff) off = maxOff;
    if (off < -maxOff) off = -maxOff;
    return {x: marginX + i*spacing, y: baseY - off};
  });

  let svg = '<svg width="'+svgWidth+'" height="'+svgHeight+'" viewBox="0 0 '+svgWidth+' '+svgHeight+'" style="display:block;">';
  svg += '<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
  svg += '<text x="14" y="'+(baseY+4)+'" style="font-size:11px; fill:var(--text-muted);">Grade level</text>';
  svg += '<line x1="90" y1="'+baseY+'" x2="'+(svgWidth-20)+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="4 4"/>';

  nodes.forEach((node, i) => {
    if (i > 0) {
      const a = positions[i-1], b = positions[i];
      const line = lines[i-1];
      const complete = isComplete(LINE_COMPLETE_FIELDS, line.data);
      const color = complete ? BLUE : RED;
      let pathD;
      if (Math.abs(a.y - b.y) < 1) {
        pathD = 'M'+(a.x+24)+','+a.y+' L'+(b.x-28)+','+b.y;
      } else {
        const midX = (a.x + b.x) / 2;
        pathD = 'M'+(a.x+24)+','+a.y+' L'+midX+','+a.y+' L'+midX+','+b.y+' L'+(b.x-28)+','+b.y;
      }
      svg += '<path class="lineseg-hit" data-idx="'+(i-1)+'" d="'+pathD+'" fill="none" stroke="transparent" stroke-width="16" pointer-events="stroke" style="cursor:pointer;"/>';
      svg += '<path class="lineseg" data-idx="'+(i-1)+'" d="'+pathD+'" fill="none" stroke="'+color+'" stroke-width="2" marker-end="url(#arrow2)" pointer-events="none"/>';
      const midLx = (a.x + b.x) / 2, midLy = Math.abs(a.y-b.y)<1 ? a.y : (a.y+b.y)/2;
      svg += '<circle cx="'+midLx+'" cy="'+(midLy-16)+'" r="7" fill="var(--surface-2)" stroke="'+color+'" stroke-width="1.5"/><text x="'+midLx+'" y="'+(midLy-12.5)+'" text-anchor="middle" style="font-size:9px; fill:'+color+';">'+(complete ? '\u2713' : '\u2715')+'</text>';
    }
  });

  nodes.forEach((node, i) => {
    const p = positions[i];
    const def = equipDefs[node.type];
    const complete = isComplete(effectiveFields(def, i), node.data);
    const color = complete ? BLUE : RED;
    const tagText = node.tag && node.tag.tag ? node.tag.tag : '';
    if (def.isBranch) {
      const toText = node.data.to ? ('To: ' + node.data.to) : 'To: ?';
      svg += '<path d="M'+p.x+','+(p.y-14)+' L'+p.x+','+(p.y-56)+'" fill="none" stroke="'+color+'" stroke-width="2" marker-end="url(#arrow2)"/>';
      svg += '<text x="'+p.x+'" y="'+(p.y-62)+'" text-anchor="middle" style="font-size:11px; fill:var(--text-secondary);">'+toText+'</text>';
    }
    if (tagText) {
      svg += '<text x="'+p.x+'" y="'+(p.y-38)+'" text-anchor="middle" style="font-size:12px; font-weight:600; fill:var(--text-primary);">'+tagText+'</text>';
    }
    svg += '<g class="nodeicon" data-idx="'+i+'" transform="translate('+p.x+','+p.y+')" style="cursor:pointer;">';
    svg += iconMarkup(node.type, color);
    svg += badgeMarkup(complete, color);
    svg += '<text x="0" y="42" text-anchor="middle" style="font-size:12px; fill:var(--text-secondary);">'+def.label+'</text>';
    svg += '</g>';
  });

  svg += '</svg>';
  chainWrap.innerHTML = svg;

  chainWrap.querySelectorAll('.nodeicon').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); showNodeForm(nodes[parseInt(el.dataset.idx)], parseInt(el.dataset.idx)); };
  });
  chainWrap.querySelectorAll('.lineseg-hit').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); showLineForm(lines[parseInt(el.dataset.idx)], parseInt(el.dataset.idx)); };
  });
  updateCalcStatus();
}

function updateCalcStatus() {
  const statusEl = document.getElementById('calc-status');
  if (!statusEl) return;
  if (nodes.length === 0) { statusEl.innerHTML = ''; statusEl.style.background = 'transparent'; statusEl.style.border = 'none'; return; }
  const r = computeSummary();
  if (r.ok) {
    statusEl.style.background = 'rgba(55,138,221,0.08)';
    statusEl.style.border = '1px solid rgba(55,138,221,0.3)';
    statusEl.style.color = BLUE;
    if (r.tdh !== null && r.maxAllowableNpshr !== null) {
      statusEl.innerHTML = '\u2713 Calculation complete \u2014 TDH ' + r.tdh.toFixed(1) + ' m, max. allowable NPSHR ' + r.maxAllowableNpshr.toFixed(2) + ' m. See Summary below or Export PDF for full results.';
    } else {
      statusEl.innerHTML = '\u2713 Boundaries set \u2014 fill in the remaining fields (pipe sizes, fluid properties, pressures\u2026) to complete the calculation. See Summary below.';
    }
  } else {
    statusEl.style.background = 'rgba(201,130,10,0.08)';
    statusEl.style.border = '1px solid rgba(201,130,10,0.3)';
    statusEl.style.color = AMBER;
    statusEl.innerHTML = '\u26a0 ' + r.msg;
  }
}

function buildFieldsHtml(fields, dataObj, cls, narrow) {
  const gridCols = narrow ? 'repeat(auto-fit, minmax(160px, 260px))' : 'repeat(auto-fit, minmax(170px, 230px))';
  let html = '<div style="display:grid; grid-template-columns:'+gridCols+'; gap:10px;">';
  fields.forEach(f => {
    html += '<div><label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:4px;">' + f.l + '</label>';
    if (f.select) {
      html += '<select class="' + cls + '" data-key="' + f.k + '" style="width:100%;"><option value="">Select\u2026</option>' +
        f.select.map(o => {
          const val = (o && typeof o === 'object') ? o.value : o;
          const lbl = (o && typeof o === 'object') ? o.label : o;
          const valEsc = String(val).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
          const lblEsc = String(lbl).replace(/&/g,'&amp;').replace(/</g,'&lt;');
          return '<option value="'+valEsc+'"'+(String(dataObj[f.k])===String(val)?' selected':'')+'>'+lblEsc+'</option>';
        }).join('') + '</select>';
    } else {
      html += '<input type="' + (f.num ? 'number' : 'text') + '" ' + (f.num ? 'step="0.1"' : '') + ' class="' + cls + '" data-key="' + f.k + '" value="' + (dataObj[f.k] || '') + '" style="width:100%;">';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function totalZoneCount() {
  return exchangerCountUpTo(nodes.length ? nodes.length - 1 : 0) + 1;
}
function renderFluidZonesPanel() {
  const panel = document.getElementById('fluid-zones-panel');
  if (!panel) return;
  const zoneCount = totalZoneCount();
  let html = '';
  for (let z = 0; z < zoneCount; z++) {
    const zoneData = getZone(z);
    html += '<div style="background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm); padding:12px 14px; min-width:220px; flex:1;">';
    html += '<p style="font-size:12px; font-weight:600; color:var(--text-secondary); margin:0 0 8px;">Fluid properties \u2014 zone ' + (z + 1) + (z > 0 ? ' (after exchanger)' : '') + '</p>';
    html += buildFieldsHtml(FLUID_FIELDS, zoneData, 'fluid-zone-field-' + z);
    html += '</div>';
  }
  panel.innerHTML = html;
  for (let z = 0; z < zoneCount; z++) {
    const zoneData = getZone(z);
    panel.querySelectorAll('.fluid-zone-field-' + z).forEach(inp => {
      const fn = () => {
        zoneData[inp.dataset.key] = inp.value;
        // Flow changes ripple through the whole downstream chain (and can
        // flip a line's complete/incomplete color), but rebuilding this
        // panel on every keystroke would steal focus from the field the
        // user is typing in \u2014 so refresh the chain/summary directly
        // instead of calling the full render().
        computeFlowMap();
        if (openLineForm && openLineForm.zoneIdx === z) updateResults(openLineForm.line, z);
        summaryPanel.innerHTML = summaryHtml();
        renderChain();
      };
      inp.oninput = fn; inp.onchange = fn;
    });
  }
}
function processBlockHtml(zoneIdx, line) {
  const flowVal = parseFloat(line.data.flow);
  const flowText = isNaN(flowVal) ? '\u2014' : flowVal.toFixed(1) + ' m3/h';
  return '<div style="margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border);">' +
    '<p style="font-size:12px; color:var(--text-secondary); margin:0 0 4px;">Flow (from zone ' + (zoneIdx+1) + ' Flow field + any Tee \u0394Flow upstream)</p>' +
    '<p style="font-size:15px; font-weight:600; color:var(--text-primary); margin:0;">' + flowText + '</p>' +
    '</div>';
}

function computeLineResult(line, zoneData) {
  const d = line.data;
  const idMm = d.nps ? pipeIdMm(d.schedule, d.nps) : null;
  const nomIn = d.nps ? NPS_NOMINAL_IN[d.nps] : null;
  const lengthM = parseFloat(d.length);
  const roughMm = parseFloat(d.roughness);
  const flowM3h = parseFloat(d.flow);
  const rho = parseFloat(zoneData.density);
  const muCp = parseFloat(zoneData.viscosity);
  if (!idMm || !lengthM || !flowM3h || !rho || !muCp || roughMm === undefined || isNaN(roughMm)) {
    return {ok:false, msg:'Select pipe schedule/size, pick a material, and enter length, flow and fluid density/viscosity to see results.'};
  }
  const ft = getFt(nomIn);
  let sumK = 0, unsupported = false;
  line.fittings.forEach(f => {
    const qty = parseFloat(f.qty) || 0;
    if (qty <= 0) return;
    const def = FITTING_K[f.type];
    if (!def) return;
    if (def.fixed !== undefined) sumK += def.fixed * qty;
    else if (def.mult !== undefined) sumK += def.mult * ft * qty;
    else if (def.sizeMult) {
      const m = def.sizeMult.find(s => nomIn <= s.max) || def.sizeMult[def.sizeMult.length-1];
      sumK += m.v * ft * qty;
    } else if (def.unsupported) unsupported = true;
  });

  const D = idMm / 1000;
  const area = Math.PI * D * D / 4;
  const Qm3s = flowM3h / 3600;
  const v = Qm3s / area;
  const mu = muCp / 1000;
  const Re = (rho * v * D) / mu;
  const relRough = (roughMm / 1000) / D;
  let f;
  if (Re < 2300 && Re > 0) f = 64 / Re;
  else if (Re >= 2300) f = 0.25 / Math.pow(Math.log10(relRough/3.7 + 5.74/Math.pow(Re,0.9)), 2);
  else f = null;

  if (!f || !isFinite(f)) return {ok:false, msg:'Could not resolve flow regime \u2014 check inputs.'};

  const totalRes = f * (lengthM / D) + sumK;
  const dpPa = totalRes * (rho * v * v) / 2;
  const dpBar = dpPa / 1e5;

  return {ok:true, v, Re, f, sumK, totalRes, dpBar, unsupported};
}

function resultsHtml(line, zoneData) {
  const r = computeLineResult(line, zoneData);
  let html = '<div id="calc-results" style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border);">';
  html += '<p style="font-size:12px; color:var(--text-muted); margin:0 0 8px;">Results</p>';
  if (!r.ok) {
    html += '<p style="font-size:12px; color:var(--text-muted);">' + r.msg + '</p>';
  } else {
    html += '<table style="font-size:12px; width:100%;">';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">Velocity</td><td>' + r.v.toFixed(2) + ' m/s</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">Reynolds number</td><td>' + Math.round(r.Re).toLocaleString() + '</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">Darcy friction factor</td><td>' + r.f.toFixed(4) + '</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">\u03a3K (fittings)</td><td>' + r.sumK.toFixed(2) + '</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0; font-weight:500;">Pressure drop</td><td style="font-weight:500; color:'+BLUE+';">' + r.dpBar.toFixed(3) + ' bar</td></tr>';
    html += '</table>';
    if (r.unsupported) html += '<p style="font-size:11px; color:'+AMBER+'; margin-top:8px;">\u26a0 Contraction/Enlargement fittings need a bore-reduction ratio, not yet modeled \u2014 excluded from \u03a3K. Use the Reducer/Enlarger equipment node instead.</p>';
  }
  html += '</div>';
  return html;
}
function updateResults(line, zoneIdx) {
  const el = document.getElementById('calc-results');
  if (!el) return;
  el.outerHTML = resultsHtml(line, getZone(zoneIdx));
}

function computeTransitionResult(node, idx) {
  if (idx <= 0 || idx >= nodes.length - 1) return {ok:false, msg:'Place this between two connected lines so both adjacent line sizes are known.'};
  const dIn = pipeIdMm(lines[idx-1].data.schedule, lines[idx-1].data.nps);
  const dOut = pipeIdMm(lines[idx].data.schedule, lines[idx].data.nps);
  const transition = node.data.transition;
  if (!dIn || !dOut) return {ok:false, msg:'Set a line size on both the incoming and outgoing lines to compute \u03b2.'};
  if (!transition) return {ok:false, msg:'Choose Sudden or Gradual to compute K.'};
  const beta = Math.min(dIn, dOut) / Math.max(dIn, dOut);
  const isContraction = dOut < dIn;
  const thetaDeg = transition === 'Gradual' ? 30 : 180;
  const theta = thetaDeg * Math.PI / 180;
  let k2;
  if (isContraction) {
    k2 = transition === 'Gradual'
      ? 0.8 * Math.sin(theta/2) * (1 - beta*beta) / Math.pow(beta,4)
      : 0.5 * Math.sqrt(Math.sin(theta/2)) * (1 - beta*beta) / Math.pow(beta,4);
  } else {
    k2 = transition === 'Gradual'
      ? 2.6 * Math.sin(theta/2) * Math.pow(1 - beta*beta, 2) / Math.pow(beta,4)
      : Math.pow(1 - beta*beta, 2) / Math.pow(beta,4);
  }
  return {ok:true, beta, isContraction, thetaDeg, k2};
}
function transitionResultsHtml(node, idx) {
  const r = computeTransitionResult(node, idx);
  let html = '<div id="calc-results" style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border);">';
  html += '<p style="font-size:12px; color:var(--text-muted); margin:0 0 8px;">Results</p>';
  if (!r.ok) {
    html += '<p style="font-size:12px; color:var(--text-muted);">' + r.msg + '</p>';
  } else {
    html += '<table style="font-size:12px; width:100%;">';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">\u03b2 (small/large)</td><td>' + r.beta.toFixed(3) + '</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">Actual type</td><td>' + (r.isContraction ? 'Contraction' : 'Enlargement') + '</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0; font-weight:500;">K2</td><td style="font-weight:500; color:'+BLUE+';">' + r.k2.toFixed(3) + '</td></tr>';
    const tr = computeTransitionDp(node, idx);
    if (tr.ok) html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0; font-weight:500;">Pressure drop</td><td style="font-weight:500; color:'+BLUE+';">' + tr.dpBar.toFixed(3) + ' bar</td></tr>';
    html += '</table>';
    html += '<p style="font-size:11px; color:var(--text-muted); margin-top:8px;">This pressure drop is included automatically in the Summary total.</p>';
  }
  html += '</div>';
  return html;
}
function updateTransitionResults(node, idx) {
  const el = document.getElementById('calc-results');
  if (!el) return;
  el.outerHTML = transitionResultsHtml(node, idx);
}

function computeTransitionDp(node, idx) {
  const r = computeTransitionResult(node, idx);
  if (!r.ok) return {ok:false};
  const refLineIdx = r.isContraction ? idx : idx - 1;
  const refLine = lines[refLineIdx];
  if (!refLine) return {ok:false};
  const zoneData = getZone(lineZone(refLineIdx));
  const rho = parseFloat(zoneData.density);
  const flowM3h = parseFloat(refLine.data.flow);
  const diamMm = pipeIdMm(refLine.data.schedule, refLine.data.nps);
  if (!rho || !flowM3h || !diamMm) return {ok:false};
  const D = diamMm / 1000;
  const area = Math.PI * D * D / 4;
  const v = (flowM3h / 3600) / area;
  const dpBar = (r.k2 * rho * v * v / 2) / 1e5;
  return {ok:true, dpBar};
}

function showNodeForm(node, idx) {
  openLineForm = null;
  const def = equipDefs[node.type];
  const fields = effectiveFields(def, idx);
  const zoneIdx = nodeZone(idx);
  formPanel.style.display = 'block';
  let html = def.noTag ? '' : buildFieldsHtml([{k:'tag', l:'Tag Number'}], node.tag, 'tag-field', true);
  if (node.type === 'pump') {

    const flowText = isNaN(flowVal) ? '\u2014 (set in the zone\u2019s Flow field above)' : flowVal.toFixed(1) + ' m3/h';
    html += '<div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border);">' +
      '<p style="font-size:12px; color:var(--text-secondary); margin:0 0 4px;">Flow (from zone ' + (zoneIdx+1) + ')</p>' +
      '<p style="font-size:15px; font-weight:600; color:var(--text-primary); margin:0;">' + flowText + '</p></div>';
  }
  html += buildFieldsHtml(fields, node.data, 'spec-field');
  if (def.isTransition) html += transitionResultsHtml(node, idx);
  if (node.type === 'valve') html += suggestedCvDpHtml(node, idx);
  formPanel.innerHTML = html;

  formPanel.querySelectorAll('.tag-field').forEach(inp => {
    const fn = () => { node.tag[inp.dataset.key] = inp.value; render(); };

  });
  formPanel.querySelectorAll('.spec-field').forEach(inp => {
    const fn = () => {
      node.data[inp.dataset.key] = inp.value;

    };
    inp.oninput = fn; inp.onchange = fn;
  });
  const useSuggestedBtn = formPanel.querySelector('.use-suggested-dp');
  if (useSuggestedBtn) useSuggestedBtn.onclick = () => {
    node.data.dp = parseFloat(useSuggestedBtn.dataset.value).toFixed(3);
    showNodeForm(node, idx);
  };
}

// Computes a suggested (not enforced) control-valve dP: the larger of 33%
// of the system's dynamic (friction+equipment) dP on this valve's side at
// Normal flow \u2014 excluding the valve's own current dP, to avoid a circular
// reference \u2014 or 10% of the boundary operating pressure on that side,
// with an editable minimum floor (default 0.7 bar).
function computeSuggestedCvDp(node, idx, r0) {
  if (!r0 || !r0.ok) return null;
  const pumpIdx = findPumpIdx();
  const side = (idx < pumpIdx) ? 'suction' : 'discharge';
  const totalDp = (side === 'suction') ? r0.sucDp : r0.disDp;
  if (totalDp === null) return null;
  const ownDp = parseFloat(node.data.dp) || 0;
  const dynamicDpExclThis = totalDp - ownDp;
  const refPress = (side === 'suction') ? parseFloat(nodes[0].data.opress) : parseFloat(nodes[nodes.length-1].data.opress);
  const floorRaw = parseFloat(node.data.dpFloor);
  const floor = isNaN(floorRaw) ? 0.7 : floorRaw;
  const byDynamic = 0.33 * dynamicDpExclThis;
  const byDest = isNaN(refPress) ? null : 0.10 * refPress;
  let suggested = byDynamic;
  if (byDest !== null && byDest > suggested) suggested = byDest;
  if (suggested < floor) suggested = floor;
  return {suggested, byDynamic, byDest, floor, side};
}

function suggestedCvDpHtml(node, idx) {
  const r0 = computeSummary();
  const s = computeSuggestedCvDp(node, idx, r0);
  let html = '<div id="suggested-cv-dp" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">';
  html += '<p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">Suggested CV dP (not forced \u2014 the field above stays manual)</p>';
  if (!s) {
    html += '<p style="font-size:12px; color:var(--text-muted);">Enter flow, fluid properties and boundary pressures to see a suggestion.</p>';
  } else {
    html += '<table style="font-size:12px; width:100%;">';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">33% of dynamic dP (excl. this valve)</td><td>' + fmt(s.byDynamic,3) + ' bar</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">10% of ' + (s.side==='suction'?'suction source':'destination') + ' pressure</td><td>' + (s.byDest===null?'\u2014':fmt(s.byDest,3)+' bar') + '</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">Minimum floor</td><td>' + fmt(s.floor,3) + ' bar</td></tr>';
    html += '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0; font-weight:500;">Suggested</td><td style="font-weight:500; color:'+BLUE+';">' + fmt(s.suggested,3) + ' bar</td></tr>';
    html += '</table>';
    html += '<button class="use-suggested-dp" data-value="'+s.suggested+'" style="margin-top:8px; font-size:12px; padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface); cursor:pointer;">Use this value</button>';
  }
  html += '</div>';
  return html;
}

let openLineForm = null;
function showLineForm(line, idx) {

// Track whether the interaction started inside the form panel (mousedown fires
// before click). This avoids a false "outside click" close when a native
// <select>/<input> commits its value in a way that reports the click target as
// outside the panel (a common mobile/webview quirk with <select> pickers),
// which otherwise made the panel appear to slam shut and the page jump up.
let formPanelInteractionStarted = false;
formPanel.addEventListener('mousedown', () => { formPanelInteractionStarted = true; });
formPanel.addEventListener('touchstart', () => { formPanelInteractionStarted = true; });
const fluidZonesPanelEl = document.getElementById('fluid-zones-panel');
fluidZonesPanelEl.addEventListener('mousedown', () => { formPanelInteractionStarted = true; });
fluidZonesPanelEl.addEventListener('touchstart', () => { formPanelInteractionStarted = true; });

document.addEventListener('click', (e) => {
  if (formPanelInteractionStarted) { formPanelInteractionStarted = false; return; }
  if (formPanel.style.display === 'block' && !formPanel.contains(e.target) && !summaryPanel.contains(e.target)) {
    formPanel.style.display = 'none';
  }
});

document.getElementById('reset-btn').onclick = (e) => {
  e.stopPropagation();
  nodes = []; lines = []; fluidZones = {}; formPanel.style.display = 'none';
  render();
  updatePaletteState();
};

// ---- Final summary ----
function findPumpIdx() { return nodes.findIndex(n => n.type === 'pump'); }

function computeSummary() {
  computeFlowMap();
  const pumpIdx = findPumpIdx();
  if (pumpIdx === -1 || pumpIdx === 0 || pumpIdx === nodes.length - 1) return {ok:false, msg:'Place a Pump somewhere between a source and a destination (Tank/Tower/Misc) to see results.'};

  const startNode = nodes[0], endNode = nodes[nodes.length - 1], pumpNode = nodes[pumpIdx];
  const validBoundaries = ['tank','tower','misc'].includes(startNode.type) && ['tank','tower','misc'].includes(endNode.type);
  if (!validBoundaries) return {ok:false, msg:'The chain must start and end on a Tank, Tower, or Miscellaneous equipment.'};

  let sucLineDp = null, disLineDp = null;
  let sucOk = true;
  for (let k = 0; k < pumpIdx; k++) {
    const r = computeLineResult(lines[k], getZone(lineZone(k)));
    if (!r.ok) { sucOk = false; break; }
    sucLineDp = (sucLineDp||0) + r.dpBar;
  }
  if (!sucOk) sucLineDp = null;
  let disOk = true;
  for (let k = pumpIdx; k < lines.length; k++) {
    const r = computeLineResult(lines[k], getZone(lineZone(k)));
    if (!r.ok) { disOk = false; break; }
    disLineDp = (disLineDp||0) + r.dpBar;
  }
  if (!disOk) disLineDp = null;

  let sucEquipDp = 0, sucEquipOk = true;
  for (let i = 1; i < pumpIdx; i++) {
    const nd = nodes[i];
    if (EQUIP_DP_TYPES.includes(nd.type)) sucEquipDp += parseFloat(nd.data.dp) || 0;
    else if (nd.type === 'reducer' || nd.type === 'enlarger') {
      const tr = computeTransitionDp(nd, i);
      if (!tr.ok) { sucEquipOk = false; break; }
      sucEquipDp += tr.dpBar;
    }
  }
  if (!sucEquipOk) sucEquipDp = null;
  let disEquipDp = 0, disEquipOk = true;
  for (let i = pumpIdx + 1; i < nodes.length - 1; i++) {
    const nd = nodes[i];
    if (EQUIP_DP_TYPES.includes(nd.type)) disEquipDp += parseFloat(nd.data.dp) || 0;
    else if (nd.type === 'reducer' || nd.type === 'enlarger') {
      const tr = computeTransitionDp(nd, i);
      if (!tr.ok) { disEquipOk = false; break; }
      disEquipDp += tr.dpBar;
    }
  }
  if (!disEquipOk) disEquipDp = null;
  const sucDp = (sucLineDp !== null && sucEquipDp !== null) ? sucLineDp + sucEquipDp : null;
  const disDp = (disLineDp !== null && disEquipDp !== null) ? disLineDp + disEquipDp : null;

  // Suction-side fluid properties come from the zone at the pump (accounts for an
  // exchanger sitting between the start tank and the pump); discharge-side fluid
  // properties come from the zone at the destination (accounts for an exchanger
  // sitting between the pump and the destination tank/tower).
  const sucZone = getZone(nodeZone(pumpIdx));
  const disZone = getZone(nodeZone(nodes.length - 1));
  const sucRho = parseFloat(sucZone.density) || null;
  const disRho = parseFloat(disZone.density) || null;
  const vapor = parseFloat(sucZone.vapor);

  const g = 9.81;
  const elevPump = parseFloat(pumpNode.data.elevation) || 0;
  const suctionNozzleOffset = (pumpNode.data.suction_nozzle_elev !== undefined && pumpNode.data.suction_nozzle_elev !== '') ? parseFloat(pumpNode.data.suction_nozzle_elev) : 0;
  const elevPumpSuctionNozzle = elevPump + suctionNozzleOffset;
  const elevStart = parseFloat(startNode.data.elevation) || 0;
  const endNozzleOffset = (endNode.data.nozzle_elev_in !== undefined && endNode.data.nozzle_elev_in !== '') ? parseFloat(endNode.data.nozzle_elev_in) : 0;
  let destNozzleElev = (parseFloat(endNode.data.elevation) || 0) + endNozzleOffset;
  // Whichever is higher \u2014 nozzle entry point or HLL \u2014 governs, since a
  // bottom-entry nozzle into a tank that can fill to HLL must still be
  // pushed against the liquid column up to the surface, not just to where
  // the nozzle physically enters.
  const destHllRaw = parseFloat(endNode.data.hll);
  let destHllElev = null;
  if (!isNaN(destHllRaw)) {
    destHllElev = (parseFloat(endNode.data.elevation) || 0) + destHllRaw;
    if (destHllElev > destNozzleElev) destNozzleElev = destHllElev;
  }
  // Conservative/standard practice: if a High Point along the discharge path
  // (e.g. a pipe rack the line crosses) sits above the destination nozzle,
  // the pump must be sized to reach that higher point instead — a full
  // liquid-filled pipe's TOTAL static head only depends on the two
  // endpoints, but designing to the highest point avoids any risk of vapor
  // lock/column separation at that point without needing a separate
  // pressure-profile check.
  let elevEndNozzle = destNozzleElev;
  for (let i = pumpIdx + 1; i < nodes.length; i++) {
    if (nodes[i].type === 'point') {
      const hp = parseFloat(nodes[i].data.elevation);
      if (!isNaN(hp) && hp > elevEndNozzle) elevEndNozzle = hp;
    }
  }
  const llll = (startNode.data.llll !== undefined && startNode.data.llll !== '') ? parseFloat(startNode.data.llll) : elevStart;
  const hhll = (startNode.data.hhll !== undefined && startNode.data.hhll !== '') ? parseFloat(startNode.data.hhll) : elevStart;

  const suctionOpPress = parseFloat(startNode.data.opress);
  const suctionDesPress = parseFloat(startNode.data.despress);
  const destOpPress = parseFloat(endNode.data.opress);
  const pressuresOk = !isNaN(suctionOpPress) && !isNaN(destOpPress);

  const staticHeadSuction = llll - elevPumpSuctionNozzle;
  const staticHeadDischarge = elevEndNozzle - elevPump;

  const suctionPress = (pressuresOk && sucRho !== null && sucDp !== null) ? suctionOpPress + (sucRho*g*staticHeadSuction)/1e5 - sucDp : null;
  const dischargePress = (pressuresOk && disRho !== null && disDp !== null) ? destOpPress + (disRho*g*staticHeadDischarge)/1e5 + disDp : null;

  const pumpDpCalc = (suctionPress !== null && dischargePress !== null) ? dischargePress - suctionPress : null;
  const tdh = (pumpDpCalc !== null && sucRho !== null) ? (pumpDpCalc * 1e5) / (sucRho * g) : null;

  const suctionDesignForMax = !isNaN(suctionDesPress) ? suctionDesPress : suctionOpPress;
  const maxSuctionHeadM = hhll - elevPumpSuctionNozzle;
  const maxSuctionPressure = (sucRho !== null && !isNaN(suctionDesignForMax)) ? (sucRho*g*maxSuctionHeadM)/1e5 + suctionDesignForMax : null;
  const shutoffRatioRaw = parseFloat(pumpNode.data.shutoffRatio);
  const shutoffRatio = isNaN(shutoffRatioRaw) ? 120 : shutoffRatioRaw;
  const shutoffPressure = (maxSuctionPressure !== null && pumpDpCalc !== null) ? maxSuctionPressure + pumpDpCalc * (shutoffRatio/100) : null;

  let npsha = null;
  if (!isNaN(vapor) && sucRho !== null && sucDp !== null && !isNaN(suctionOpPress)) {
    npsha = ((suctionOpPress - vapor) * 1e5) / (sucRho * g) + staticHeadSuction - (sucDp * 1e5) / (sucRho * g);
  }
  const npshMarginReq = parseFloat(pumpNode.data.npshMarginReq);
  // Before a pump is selected there's no vendor NPSHR to compare against \u2014
  // instead the project sets a required margin, and this gives the maximum
  // NPSHR any vendor's pump may have (used as the accept/reject criterion
  // in the TBE), rather than computing a margin from a vendor's NPSHR.
  const maxAllowableNpshr = (npsha !== null && !isNaN(npshMarginReq)) ? (npsha - npshMarginReq) : null;

  const flow = parseFloat(pumpNode.data.flow);
  const effP = parseFloat(pumpNode.data.effp);
  const effM = parseFloat(pumpNode.data.effm);
  let hydraulicPower = null, bhp = null, absorbedPower = null;
  if (flow && pumpDpCalc !== null) {
    hydraulicPower = (flow * pumpDpCalc) / 36;
    if (effP) bhp = hydraulicPower / (effP/100);
    if (bhp !== null && effM) absorbedPower = bhp / (effM/100);
  }

  return {ok:true, sucLineDp, sucEquipDp, sucDp, disLineDp, disEquipDp, disDp, suctionPress, dischargePress,
    pumpDpCalc, maxSuctionPressure, shutoffPressure, shutoffRatio, tdh, npsha, npshMarginReq: isNaN(npshMarginReq)?null:npshMarginReq, maxAllowableNpshr,
    hydraulicPower, bhp, absorbedPower, staticHeadSuction, staticHeadDischarge,
    governingDischargeElev: elevEndNozzle, destNozzleElev, highPointGoverns: elevEndNozzle > destNozzleElev};
}

// Approximates NPSHA/pressures/power/TDH for a Min or Max flow case by
// scaling each line's and equipment node's Normal-case friction dP by
// (Q_case/Q_normal)^2 at that node's local position (accounting for Tee
// \u0394Flow, which is NOT itself scaled \u2014 a Tee's extra/branched stream is
// treated as a fixed quantity, not proportional to the main flow).
// Elevation-based static heads and the boundary operating pressures are
// held constant across cases, per the drafted spec. This is intentionally
// an approximation (no full velocity/Reynolds recompute) \u2014 same
// simplification used in the reference hand-calc this was modeled on.
// Approximates a centrifugal pump's own H-Q curve as a parabola through two
// known points: (0, Hs) at shutoff and (Q_rated, Hr) at the Normal-case
// duty point (the only case computed with the user's exact entered data,
// not a Q\u00b2 approximation) \u2014 the same shape assumption already used for
// the Shutoff \u0394P margin. Returns the pump's own head output (m) at any
// other flow.
function pumpHeadAtFlow(Qcase, r0) {
  if (!r0 || !r0.ok || r0.tdh === null || !Qcase || isNaN(Qcase)) return null;
  const pumpIdx = findPumpIdx();
  if (pumpIdx < 0) return null;
  const Qrated = parseFloat(nodes[pumpIdx].data.flow);
  if (!Qrated || isNaN(Qrated)) return null;
  const Hr = r0.tdh;
  const Hs = Hr * (r0.shutoffRatio / 100);
  const ratio = Qcase / Qrated;
  return Hs - (Hs - Hr) * ratio * ratio;
}

function computeCaseSummary(caseKey, r0) {
  if (!r0 || !r0.ok) return {ok:false};
  const pumpIdx = findPumpIdx();
  if (pumpIdx === -1 || pumpIdx === 0 || pumpIdx === nodes.length - 1) return {ok:false};
  const startNode = nodes[0], endNode = nodes[nodes.length - 1], pumpNode = nodes[pumpIdx];

  const normalLineFlow = computeFlowMapForBase('flow');
  const caseLineFlow = computeFlowMapForBase(caseKey);
  function lineScale(k) {
    const nf = normalLineFlow[k], cf = caseLineFlow[k];
    if (!nf || isNaN(nf) || cf === null || cf === undefined || isNaN(cf)) return null;
    return (cf / nf) * (cf / nf);
  }
  function nodeScale(i) {
    const nf = nodeLocalFlow(i, normalLineFlow), cf = nodeLocalFlow(i, caseLineFlow);
    if (nf === null || !nf || cf === null) return null;
    return (cf / nf) * (cf / nf);
  }

  let sucLineDp = 0, sucOk = true;
  for (let k = 0; k < pumpIdx; k++) {
    const s = lineScale(k);
    const rr = computeLineResult(lines[k], getZone(lineZone(k)));
    if (s === null || !rr.ok) { sucOk = false; break; }
    sucLineDp += rr.dpBar * s;
  }
  if (!sucOk) sucLineDp = null;

  let sucEquipDp = 0, sucEquipOk = true;
  for (let i = 1; i < pumpIdx; i++) {
    const nd = nodes[i], s = nodeScale(i);
    if (EQUIP_DP_TYPES.includes(nd.type)) {
      if (s === null) { sucEquipOk = false; break; }
      sucEquipDp += (parseFloat(nd.data.dp) || 0) * s;
    } else if (nd.type === 'reducer' || nd.type === 'enlarger') {
      const tr = computeTransitionDp(nd, i);
      if (!tr.ok || s === null) { sucEquipOk = false; break; }
      sucEquipDp += tr.dpBar * s;
    }
  }
  if (!sucEquipOk) sucEquipDp = null;
  const sucDp = (sucLineDp !== null && sucEquipDp !== null) ? sucLineDp + sucEquipDp : null;

  const sucZone = getZone(nodeZone(pumpIdx));
  const sucRho = parseFloat(sucZone.density) || null;
  const disRho = parseFloat(getZone(nodeZone(nodes.length - 1)).density) || null;
  const vapor = parseFloat(sucZone.vapor);
  const g = 9.81;
  const suctionOpPress = parseFloat(startNode.data.opress);
  const destOpPress = parseFloat(endNode.data.opress);
  const pressuresOk = !isNaN(suctionOpPress) && !isNaN(destOpPress);

  const suctionPress = (pressuresOk && sucRho !== null && sucDp !== null) ? suctionOpPress + (sucRho*g*r0.staticHeadSuction)/1e5 - sucDp : null;

  // Discharge side: if there's a Control Valve downstream of the pump, it's
  // the balancing element (see computeCVResidualCase()) \u2014 the pump's own
  // curve drives dischargePress, not a Q\u00b2-scaled sum through the valve.
  // With no valve, fall back to the old system-required approach (sum every
  // line/equipment dP, Q\u00b2-scaled, working backward from the fixed
  // destination pressure).
  let disValveIdx = -1;
  for (let i = pumpIdx + 1; i < nodes.length - 1; i++) if (nodes[i].type === 'valve') disValveIdx = i;

  let dischargePress, pumpDpCalc, tdh;
  if (disValveIdx !== -1) {
    const Qpump = nodeLocalFlow(pumpIdx, caseLineFlow);
    const Hcase = pumpHeadAtFlow(Qpump, r0);
    pumpDpCalc = (Hcase !== null && sucRho !== null) ? (Hcase * sucRho * g) / 1e5 : null;
    tdh = Hcase;
    dischargePress = (suctionPress !== null && pumpDpCalc !== null) ? suctionPress + pumpDpCalc : null;
  } else {
    let disLineDp = 0, disOk = true;
    for (let k = pumpIdx; k < lines.length; k++) {
      const s = lineScale(k);
      const rr = computeLineResult(lines[k], getZone(lineZone(k)));
      if (s === null || !rr.ok) { disOk = false; break; }
      disLineDp += rr.dpBar * s;
    }
    if (!disOk) disLineDp = null;
    let disEquipDp = 0, disEquipOk = true;
    for (let i = pumpIdx + 1; i < nodes.length - 1; i++) {
      const nd = nodes[i], s = nodeScale(i);
      if (EQUIP_DP_TYPES.includes(nd.type)) {
        if (s === null) { disEquipOk = false; break; }
        disEquipDp += (parseFloat(nd.data.dp) || 0) * s;
      } else if (nd.type === 'reducer' || nd.type === 'enlarger') {
        const tr = computeTransitionDp(nd, i);
        if (!tr.ok || s === null) { disEquipOk = false; break; }
        disEquipDp += tr.dpBar * s;
      }
    }
    if (!disEquipOk) disEquipDp = null;
    const disDp = (disLineDp !== null && disEquipDp !== null) ? disLineDp + disEquipDp : null;
    dischargePress = (pressuresOk && disRho !== null && disDp !== null) ? destOpPress + (disRho*g*r0.staticHeadDischarge)/1e5 + disDp : null;
    pumpDpCalc = (suctionPress !== null && dischargePress !== null) ? dischargePress - suctionPress : null;
    tdh = (pumpDpCalc !== null && sucRho !== null) ? (pumpDpCalc * 1e5) / (sucRho * g) : null;
  }

  let npsha = null;
  if (!isNaN(vapor) && sucRho !== null && sucDp !== null && !isNaN(suctionOpPress)) {
    npsha = ((suctionOpPress - vapor) * 1e5) / (sucRho * g) + r0.staticHeadSuction - (sucDp * 1e5) / (sucRho * g);
  }
  const npshMarginReq = r0.npshMarginReq;
  const maxAllowableNpshr = (npsha !== null && npshMarginReq !== null) ? npsha - npshMarginReq : null;

  const flow = nodeLocalFlow(pumpIdx, caseLineFlow);
  let hydraulicPower = null;
  if (flow && pumpDpCalc !== null) hydraulicPower = (flow * pumpDpCalc) / 36;

  return {ok:true, flow, sucDp, suctionPress, dischargePress, pumpDpCalc, tdh, npsha, maxAllowableNpshr, hydraulicPower,
    caseLineFlow};
}

function fmt(v, d) { return (v===null || v===undefined || isNaN(v)) ? '\u2014' : v.toFixed(d===undefined?2:d); }

  html += row('Total discharge DP', fmt(r.disDp,3), 'bar');
  html += row('Static head (pump \u2192 delivery)', fmt(r.staticHeadDischarge,2), 'm');

  html += '<div style="margin-top:12px;"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">DISCHARGE LINES &amp; FITTINGS</p>' + lineBreakdownHtml(pumpIdxS, lines.length) + '</div>';
  html += '<div style="margin-top:12px;"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">SUCTION IN-LINE EQUIPMENT (control valves, orifices, filters, misc.)</p>' + equipRowsHtml(1, pumpIdxS) + '</div>';
  html += '<div style="margin-top:12px;"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">DISCHARGE IN-LINE EQUIPMENT (control valves, orifices, filters, misc.)</p>' + equipRowsHtml(pumpIdxS+1, nodes.length-1) + '</div>';
  html += '<p style="font-size:11px; color:var(--text-muted); margin-top:10px;">The \u03a3K of the fittings listed above for each line is already included in that line\u2019s DP and in the totals above \u2014 nothing further to add.</p>';

  html += '<div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);"><p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">PUMP CHARACTERISTICS</p>';
  html += '<table style="font-size:13px; width:100%;">';
  html += row('Pump DP calc. (diff. press at Qd)', fmt(r.pumpDpCalc,3), 'bar');

}

function pumpHeadEstimationHtml(r0) {
  if (!r0 || !r0.ok || r0.tdh === null) return '';
  if (!getZoneAnyHasMinMax()) return '';
  const pumpIdx = findPumpIdx();
  const cases = [
    {key:'qMin', label:'MIN'},
    {key:'flow', label:'NORMAL (rated)'},
    {key:'qMax', label:'MAX'}
  ];
  const rows = cases.map(c => {
    const caseLineFlow = computeFlowMapForBase(c.key);
    const Qcase = nodeLocalFlow(pumpIdx, caseLineFlow);
    const H = (c.key === 'flow') ? r0.tdh : pumpHeadAtFlow(Qcase, r0);
    const rise = (H !== null) ? H - r0.tdh : null;
    return {label:c.label, flow:Qcase, head:H, rise};
  });
  const Hs = r0.tdh * (r0.shutoffRatio / 100);
  let html = '<div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);">';
  html += '<p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">PUMP HEAD ESTIMATION (curve interpolation)</p>';
  html += '<table style="font-size:12px; width:100%;"><tr><th></th>' + rows.map(x=>'<th style="text-align:left; padding:2px 12px 2px 0;">'+x.label+'</th>').join('') + '</tr>';
  function tr(label, get, unit, dec) {
    return '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">'+label+'</td>' +
      rows.map(x => '<td>' + (get(x)!==null && get(x)!==undefined && !isNaN(get(x)) ? fmt(get(x), dec) + (unit?' '+unit:'') : '\u2014') + '</td>').join('') + '</tr>';
  }
  html += tr('Flow', x=>x.flow, 'm3/h', 1);
  html += tr('Pump head (estimated)', x=>x.head, 'm', 1);
  html += tr('Head rise vs. Normal', x=>x.rise, 'm', 1);
  html += '</table>';
  html += '<p style="font-size:11px; color:var(--text-muted); margin-top:8px;">Estimated head at Shutoff (Q=0): ' + fmt(Hs,1) + ' m (Normal-case head \u00d7 Shutoff \u0394P margin). Curve shape assumed parabolic through the Shutoff point and the Normal-case duty point \u2014 an early-sizing approximation, not the selected pump\u2019s actual vendor curve.</p>';
  html += '</div>';
  return html;
}

// Min/Normal/Max side-by-side summary, using each zone's optional Q Min/Q
// Max fields (blank \u2014 that case just doesn't render). Approximate: see
// computeCaseSummary()'s header comment for the scaling method/limits.
function threePointSummaryHtml(r0) {
  const cases = [
    {key:'qMin', label:'MIN'},
    {key:'flow', label:'NORMAL'},
    {key:'qMax', label:'MAX'}
  ];
  const results = cases.map(c => ({label:c.label, r: c.key==='flow' ? r0 : computeCaseSummary(c.key, r0)}));
  if (!getZoneAnyHasMinMax()) return '';
  let html = '<div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);">';
  html += '<p style="font-size:12px; color:var(--text-muted); margin:0 0 6px;">MIN / NORMAL / MAX FLOW CASES</p>';
  html += '<table style="font-size:12px; width:100%;"><tr><th></th>' + results.map(x=>'<th style="text-align:left; padding:2px 12px 2px 0;">'+x.label+'</th>').join('') + '</tr>';
  function tr(label, get, unit) {
    return '<tr><td style="color:var(--text-secondary); padding:2px 12px 2px 0;">'+label+'</td>' +
      results.map(x => '<td>' + (x.r && x.r.ok ? fmt(get(x.r), unit==='kW'?2:(unit==='m3/h'?1:3)) + (unit?' '+unit:'') : '\u2014') + '</td>').join('') + '</tr>';
  }
  html += tr('Flow', x=>x.flow, 'm3/h');
  html += tr('Suction pressure', x=>x.suctionPress, 'bara');
  html += tr('Discharge pressure', x=>x.dischargePress, 'bara');
  html += tr('Pump \u0394P', x=>x.pumpDpCalc, 'bar');
  html += tr('TDH', x=>x.tdh, 'm');
  html += tr('NPSH available', x=>x.npsha, 'm');
  html += tr('Max. allowable NPSHR', x=>x.maxAllowableNpshr, 'm');
  html += tr('Hydraulic power', x=>x.hydraulicPower, 'kW');
  html += '</table>';
  html += '<p style="font-size:11px; color:var(--text-muted); margin-top:8px;">Min/Max are approximated by scaling each line/equipment\u2019s friction dP by (Q/Q\u2099\u2092\u1d63\u2098\u2090\u2097)\u00b2 \u2014 not a full recompute. Static (elevation) heads and boundary pressures are held constant across cases.</p>';
  html += '</div>';
  return html;
}
function getZoneAnyHasMinMax() {
  return Object.keys(fluidZones).some(z => {
    const zd = fluidZones[z];
    return (zd.qMin !== undefined && zd.qMin !== '') || (zd.qMax !== undefined && zd.qMax !== '');
  });
}

function fmtR(v, d) { return (v===null || v===undefined || isNaN(v)) ? '' : v.toFixed(d===undefined?2:d); }

function fittingsSummary(line) {
  if (!line.fittings.length) return '\u2014';
  return line.fittings.filter(f => f.qty).map(f => (f.qty||'') + '\u00d7 ' + f.type).join(', ');
}

function lineReportRow(k) {
  const line = lines[k];
  const zoneData = getZone(lineZone(k));
  const r = computeLineResult(line, zoneData);
  const lengthM = parseFloat(line.data.length);
  const specificDpBarKm = (r.ok && lengthM) ? (r.dpBar/lengthM)*1000 : null;
  return {
    tag: (line.tag && line.tag.tag) ? line.tag.tag : ('Line ' + (k+1)),
    nps: line.data.nps ? (line.data.nps + (line.data.schedule ? ' (Sch '+line.data.schedule+')' : '')) : '', volFlow: line.data.flow,
    velocity: r.ok ? r.v : null, length: lengthM, specificDpBarKm,
    dpBar: r.ok ? r.dpBar : null, fittings: fittingsSummary(line)
  };
}

function equipRowsHtml(fromI, toI) {
  let t = '<table><tr><th>Tag</th><th>Type</th><th>Pressure drop (bar)</th></tr>';
  let any = false;
  for (let i = fromI; i < toI; i++) {
    const nd = nodes[i];
    let dpVal = null;
    if (EQUIP_DP_TYPES.includes(nd.type)) dpVal = parseFloat(nd.data.dp) || 0;
    else if (nd.type === 'reducer' || nd.type === 'enlarger') { const tr = computeTransitionDp(nd, i); dpVal = tr.ok ? tr.dpBar : 0; }
    if (dpVal === null) continue;
    any = true;
    const tag = (nd.tag && nd.tag.tag) ? nd.tag.tag : '\u2014';
    t += '<tr><td>' + tag + '</td><td>' + equipDefs[nd.type].label + '</td><td>' + fmtR(dpVal,3) + '</td></tr>';
  }
  t += '</table>';
  return any ? t : '<p style="font-size:11px; color:#666;">None</p>';
}

    '<td style="width:55%;"><b>CLIENT:</b> ' + (reportInfo.client||'') + '<br><b>PLANT:</b> ' + (reportInfo.plant||'') + '</td>' +

  }
  html += '<p style="font-weight:600; margin:6px 0 2px;">Suction lines</p>' + lineRowsHtml(0, pumpIdx);

      const tr = computeTransitionResult(nd, i);
      if (tr.ok) anyTransitionNotes += '<p style="font-size:10px; margin:2px 0;">' + equipDefs[nd.type].label + ' at ' + ((nd.tag && nd.tag.tag) ? nd.tag.tag : ('#'+i)) + ': K2 = ' + tr.k2.toFixed(3) + ' (' + nd.data.transition + ')</p>';
    }
  });
  if (anyTransitionNotes) html += '<div style="margin-top:6px;">' + anyTransitionNotes + '</div>';

  html += threePointReportHtml(r);
  html += pumpHeadEstimationReportHtml(r);
  html += controlValveDatasheetHtml(r);

  return html;
}

function computeValveCv(flowM3h, dpBar, densityKgM3) {
  if (!flowM3h || !dpBar || dpBar <= 0 || !densityKgM3) return null;
  const qGpm = flowM3h * 4.402868;
  const dpPsi = dpBar * 14.5038;
  const sg = densityKgM3 / 1000;
  return qGpm * Math.sqrt(sg / dpPsi);
}

// One table per Control Valve node, for each of the Min/Normal/Max cases:
// local flow, an approximate inlet/outlet pressure (cumulative friction+
// equipment dP from the nearest boundary, Q\u00b2-scaled per case; intermediate
// elevation is not tracked \u2014 same simplification used throughout this
// module), the resulting valve dP, and Cv via the base ISA-75.01.01 liquid
// formula (no Fp/choked-flow correction \u2014 an early-sizing estimate, not a
// substitute for the vendor's own sizing).
function threePointReportHtml(r0) {
  if (!getZoneAnyHasMinMax()) return '';
  const cases = [{key:'qMin', label:'Min'}, {key:'flow', label:'Normal'}, {key:'qMax', label:'Max'}];
  const results = cases.map(c => ({label:c.label, r: c.key==='flow' ? r0 : computeCaseSummary(c.key, r0)}));
  let html = '<div class="rpt-section-title">6. MIN / NORMAL / MAX FLOW CASES</div>';
  html += '<table><tr><th></th>' + results.map(x=>'<th>'+x.label+'</th>').join('') + '</tr>';
  function tr(label, get, unit, dec) {
    return '<tr><td>'+label+'</td>' + results.map(x => '<td>' + (x.r && x.r.ok && get(x.r)!==null ? fmtR(get(x.r), dec) + (unit?' '+unit:'') : '\u2014') + '</td>').join('') + '</tr>';
  }
  html += tr('Flow', x=>x.flow, 'm3/h', 1);
  html += tr('Suction pressure', x=>x.suctionPress, 'bara', 3);
  html += tr('Discharge pressure', x=>x.dischargePress, 'bara', 3);
  html += tr('Pump \u0394P', x=>x.pumpDpCalc, 'bar', 3);
  html += tr('TDH', x=>x.tdh, 'm', 1);
  html += tr('NPSH available', x=>x.npsha, 'm', 2);
  html += tr('Max. allowable NPSHR', x=>x.maxAllowableNpshr, 'm', 2);
  html += tr('Hydraulic power', x=>x.hydraulicPower, 'kW', 2);
  html += '</table>';
  html += '<p style="font-size:10px; color:#666; margin:2px 0 6px;">Min/Max friction dP is scaled by (Q/Q normal)\u00b2 per line/equipment (not a full recompute); static heads and boundary pressures are held constant across cases. Where a discharge Control Valve is present, its dP is solved as a residual balancing the pump curve against the fixed destination pressure (see section 8), not scaled.</p>';
  return html;
}

function pumpHeadEstimationReportHtml(r0) {
  if (!r0 || !r0.ok || r0.tdh === null) return '';
  if (!getZoneAnyHasMinMax()) return '';
  const pumpIdx = findPumpIdx();
  const cases = [{key:'qMin', label:'Min'}, {key:'flow', label:'Normal (rated)'}, {key:'qMax', label:'Max'}];
  const rows = cases.map(c => {
    const caseLineFlow = computeFlowMapForBase(c.key);
    const Qcase = nodeLocalFlow(pumpIdx, caseLineFlow);
    const H = (c.key === 'flow') ? r0.tdh : pumpHeadAtFlow(Qcase, r0);
    const rise = (H !== null) ? H - r0.tdh : null;
    return {label:c.label, flow:Qcase, head:H, rise};
  });
  const Hs = r0.tdh * (r0.shutoffRatio / 100);
  let html = '<div class="rpt-section-title">7. PUMP HEAD ESTIMATION</div>';
  html += '<table><tr><th></th>' + rows.map(x=>'<th>'+x.label+'</th>').join('') + '</tr>';
  function tr(label, get, unit, dec) {
    return '<tr><td>'+label+'</td>' + rows.map(x => {
      const v = get(x);
      return '<td>' + (v !== null && v !== undefined && !isNaN(v) ? fmtR(v, dec) + (unit?' '+unit:'') : '\u2014') + '</td>';
    }).join('') + '</tr>';
  }
  html += tr('Flow', x=>x.flow, 'm3/h', 1);
  html += tr('Pump head (estimated)', x=>x.head, 'm', 1);
  html += tr('Head rise vs. Normal', x=>x.rise, 'm', 1);
  html += '</table>';
  html += '<p style="font-size:10px; color:#666; margin:2px 0 6px;">Estimated head at Shutoff (Q=0): ' + fmtR(Hs,1) + ' m (Normal-case head \u00d7 Shutoff \u0394P margin). Parabolic curve shape through the Shutoff point and the Normal-case duty point \u2014 an early-sizing approximation, not the selected pump\u2019s actual vendor curve.</p>';
  return html;
}

function controlValveDatasheetHtml(r0) {
  if (!r0 || !r0.ok) return '';
  const pumpIdx = findPumpIdx();
  const valveIdxs = [];
  nodes.forEach((nd, i) => { if (nd.type === 'valve') valveIdxs.push(i); });
  if (!valveIdxs.length) return '';

  const normalLineFlow = computeFlowMapForBase('flow');
  const caseKeys = [{key:'qMin', label:'Min'}, {key:'flow', label:'Normal'}, {key:'qMax', label:'Max'}];
  const disRho = parseFloat(getZone(nodeZone(nodes.length - 1)).density) || null;
  const elevPump = parseFloat(nodes[pumpIdx].data.elevation) || 0;
  const g = 9.81;

  // Friction-only (Q\u00b2-scaled) sum between two node indices \u2014 elevation is
  // handled separately by the caller, since a segment's elevation delta
  // doesn't depend on the case flow.
  function frictionSum(fromLineIdx, toIdx, fromNodeIdx, normalArr, caseArr) {
    let cum = 0;
    for (let k = fromLineIdx; k < toIdx; k++) {
      const nfk = normalArr[k], cfk = caseArr[k];
      if (!nfk || isNaN(nfk) || cfk === null || cfk === undefined || isNaN(cfk)) return null;
      const sc = (cfk/nfk)*(cfk/nfk);
      const rr = computeLineResult(lines[k], getZone(lineZone(k)));
      if (!rr.ok) return null;
      cum += rr.dpBar * sc;
    }
    for (let i2 = fromNodeIdx; i2 < toIdx; i2++) {
      const nd2 = nodes[i2];
      const nfk = nodeLocalFlow(i2, normalArr), cfk = nodeLocalFlow(i2, caseArr);
      if (nfk === null || !nfk || cfk === null) return null;
      const sc = (cfk/nfk)*(cfk/nfk);
      if (EQUIP_DP_TYPES.includes(nd2.type)) cum += (parseFloat(nd2.data.dp) || 0) * sc;
      else if (nd2.type === 'reducer' || nd2.type === 'enlarger') {
        const tr = computeTransitionDp(nd2, i2);
        if (!tr.ok) return null;
        cum += tr.dpBar * sc;
      }
    }
    return cum;
  }

  let html = '<div class="rpt-section-title">8. CONTROL VALVE PROCESS DATASHEET</div>';
  html += '<p style="font-size:10px; color:#666; margin:2px 0 6px;">Discharge-side valve dP is solved as the residual needed to balance the pump\u2019s own curve (interpolated between the Normal-case duty point and the Shutoff estimate) against the fixed destination pressure \u2014 not scaled from the manually-entered dP \u2014 which correctly increases at Min flow (valve closes more) and decreases at Max flow, matching real control-valve behavior. A suction-side valve (no fixed anchor to balance against) still uses the simpler (Q/Q normal)\u00b2 scaling of its own entered dP. If this valve\u2019s own Elevation field is left blank, it defaults to the pump\u2019s elevation (no pump\u2192valve elevation credit; the full pump\u2192destination elevation change is then carried on the valve\u2192destination segment). Cv is the base ISA-75.01.01 liquid formula only (no Fp/choked-flow correction) \u2014 verify against the valve vendor\u2019s own data sheet.</p>';

  valveIdxs.forEach(idx => {
    const nd = nodes[idx];
    const tag = (nd.tag && nd.tag.tag) ? nd.tag.tag : ('Valve #' + (idx+1));
    const side = (idx < pumpIdx) ? 'suction' : 'discharge';
    const zone = getZone(nodeZone(idx));
    const rho = parseFloat(zone.density);
    const ownDpNormal = parseFloat(nd.data.dp) || 0;
    const elevValveRaw = parseFloat(nd.data.elevation);
    const elevValve = isNaN(elevValveRaw) ? elevPump : elevValveRaw;

    const rowsData = caseKeys.map(c => {
      const caseLineFlow = computeFlowMapForBase(c.key);
      const localFlow = nodeLocalFlow(idx, caseLineFlow);
      const caseR = (c.key === 'flow') ? r0 : computeCaseSummary(c.key, r0);
      let inletP = null, outletP = null, valveDp = null, cv = null;

      if (side === 'discharge') {
        const pumpOutlet = (caseR && caseR.ok && caseR.suctionPress !== null && caseR.pumpDpCalc !== null) ? caseR.suctionPress + caseR.pumpDpCalc : null;
        const fricA = frictionSum(pumpIdx, idx, pumpIdx + 1, normalLineFlow, caseLineFlow);
        if (pumpOutlet !== null && fricA !== null && disRho !== null) {
          inletP = pumpOutlet - (disRho*g*(elevValve - elevPump))/1e5 - fricA;
        }
        const elevDest = r0.governingDischargeElev;
        const fricB = frictionSum(idx + 1, nodes.length - 1, idx + 1, normalLineFlow, caseLineFlow);
        const destOpPress = parseFloat(nodes[nodes.length-1].data.opress);
        if (!isNaN(destOpPress) && fricB !== null && disRho !== null) {
          outletP = destOpPress + (disRho*g*(elevDest - elevValve))/1e5 + fricB;
        }
        if (inletP !== null && outletP !== null) valveDp = inletP - outletP;
      } else {
        const nf = nodeLocalFlow(idx, normalLineFlow);
        const scale = (nf && localFlow !== null) ? (localFlow/nf)*(localFlow/nf) : null;
        valveDp = (scale !== null) ? ownDpNormal * scale : null;
        const fricA = frictionSum(0, idx, 1, normalLineFlow, caseLineFlow);
        const srcP = parseFloat(nodes[0].data.opress);
        if (!isNaN(srcP) && fricA !== null) inletP = srcP - fricA;
        if (inletP !== null && valveDp !== null) outletP = inletP - valveDp;
      }
      if (localFlow && valveDp && valveDp > 0 && rho) cv = computeValveCv(localFlow, valveDp, rho);
      return {label:c.label, flow:localFlow, inletP, outletP, dp:valveDp, cv};
    });

    html += '<p style="font-weight:600; margin:8px 0 2px;">' + tag + ' (' + side + ' side)</p>';
    html += '<table><tr><th></th><th>Min</th><th>Normal</th><th>Max</th></tr>';
    function trr(label, get, unit, dec) {
      return '<tr><td>'+label+'</td>' + rowsData.map(x => {
        const v = get(x);
        return '<td>' + ((v !== null && v !== undefined && !isNaN(v)) ? fmtR(v,dec)+(unit?' '+unit:'') : '\u2014') + '</td>';
      }).join('') + '</tr>';
    }
    html += trr('Flow', x=>x.flow, 'm3/h', 1);
    html += trr('Inlet pressure', x=>x.inletP, 'bar(a)', 3);
    html += trr('Outlet pressure', x=>x.outletP, 'bar(a)', 3);
    html += trr('Valve dP', x=>x.dp, 'bar', 3);
    html += trr('Cv (approx.)', x=>x.cv, '', 1);
    html += '</table>';
  });
  return html;
}

      });
      const s6 = [['CONTROL VALVE PROCESS DATASHEET \u2014 ' + tag + ' (' + side + ' side)'], ['', ...rowsData.map(x=>x.label)],
        ['Flow (m3/h)', ...rowsData.map(x=>num(x.flow))],
        ['Inlet pressure (bara)', ...rowsData.map(x=>num(x.inletP))],
        ['Outlet pressure (bara)', ...rowsData.map(x=>num(x.outletP))],
        ['Valve dP (bar)', ...rowsData.map(x=>num(x.dp))],
        ['Cv (approx.)', ...rowsData.map(x=>num(x.cv))]];
      const sheetName = ('CV ' + tag).substring(0,31) || ('CV_' + (vi+1));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s6), sheetName);
    });
  }

  const fname = 'SEZTools_Pump_' + (pumpNode.tag && pumpNode.tag.tag ? pumpNode.tag.tag : 'export') + '.xlsx';
  XLSX.writeFile(wb, fname);
};

render();
</script>
